<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <text x="320" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Bài toán thực tế: Hộp quà từ tấm tôn hình vuông</text>
  <!-- Tấm tôn vuông a×a (scale: a=21cm, 8px/cm approx but we show symbolic) -->
  <!-- Draw 280x280 box, centered at 220,190 -->
  <!-- Full sheet 280x280 TL=(80,50) -->
  <rect x="80" y="50" width="280" height="280" rx="3" fill="#c8d8e8" stroke="#5570a0" stroke-width="2"/>
  <!-- 4 corner squares 8*k=8*8=64px (8cm scale=8px/cm) -->
  <!-- corners: TL, TR, BL, BR at (80,50),(296,50),(80,266),(296,266) each 64x64 -->
  <rect x="80" y="50" width="64" height="64" rx="2" fill="#ffb3b3" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="296" y="50" width="64" height="64" rx="2" fill="#ffb3b3" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="80" y="266" width="64" height="64" rx="2" fill="#ffb3b3" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="296" y="266" width="64" height="64" rx="2" fill="#ffb3b3" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Base rectangle in center (280-128)=152px wide, 152px tall -->
  <rect x="144" y="114" width="152" height="152" rx="2" fill="#7ab3d4" stroke="#1565c0" stroke-width="2"/>
  <text x="220" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">ĐÁY HỘP</text>
  <text x="220" y="210" text-anchor="middle" font-size="11" fill="#0d47a1">(a − 16) cm</text>
  <!-- Labels: cut 8cm label top-left corner -->
  <text x="112" y="78" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">8 cm</text>
  <!-- a label left -->
  <line x1="58" y1="50" x2="58" y2="330" stroke="#444" stroke-width="1.5" marker-start="url(#aa1)" marker-end="url(#aa1)"/>
  <defs>
    <marker id="aa1" markerWidth="6" markerHeight="5" refX="3" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#444"/></marker>
  </defs>
  <text x="30" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" transform="rotate(-90,30,194)">a = ? cm</text>
  <!-- Solution box right -->
  <rect x="390" y="80" width="230" height="200" rx="8" fill="#f0fff4" stroke="#009060" stroke-width="2"/>
  <text x="505" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#003300">Lời giải</text>
  <text x="505" y="126" text-anchor="middle" font-size="11" fill="#222">Sau khi cắt 4 góc 8 cm:</text>
  <text x="505" y="146" text-anchor="middle" font-size="11" fill="#222">• Cạnh đáy = a − 16 (cm)</text>
  <text x="505" y="164" text-anchor="middle" font-size="11" fill="#222">• Chiều cao h = 8 cm</text>
  <text x="505" y="186" text-anchor="middle" font-size="11" fill="#222">V = 8(a−16)² = 200</text>
  <text x="505" y="206" text-anchor="middle" font-size="11" fill="#222">(a−16)² = 25</text>
  <text x="505" y="226" text-anchor="middle" font-size="11" fill="#222">a − 16 = 5 → a = 21 cm</text>
  <text x="505" y="252" text-anchor="middle" font-size="11" fill="#888">(a−16 = −5 → a=11, loại)</text>
  <!-- Answer highlight -->
  <rect x="415" y="260" width="180" height="28" rx="6" fill="#e8f5e9" stroke="#009060" stroke-width="1.5"/>
  <text x="505" y="279" text-anchor="middle" font-size="13" fill="#006040" font-weight="bold">✅ a = 21 cm</text>
</svg>
