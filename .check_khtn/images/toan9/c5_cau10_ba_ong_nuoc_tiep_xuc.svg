<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="100%" style="max-width: 560px; max-height: 330px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="550" height="320" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="280" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">BA ĐƯỜNG ỐNG TIẾP XÚC NHAU VÀ MẶT ĐẤT</text>

  <!-- Mặt đất tại y=260 -->
  <rect x="20" y="260" width="520" height="50" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
  <line x1="20" y1="260" x2="540" y2="260" stroke="#334155" stroke-width="3" />

  <!-- Ống lớn 1: O1(140, 170), R=90px (30cm) -->
  <circle cx="140" cy="170" r="90" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="3" />
  <circle cx="140" cy="170" r="75" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="140" cy="170" r="4.5" fill="#0284c7" />
  <text x="125" y="175" font-size="14" font-weight="bold" fill="#0284c7">O₁</text>
  <text x="110" y="140" font-size="12" font-weight="bold" fill="#0284c7">R = 30</text>

  <!-- Ống lớn 2: O2(320, 170), R=90px (30cm) -->
  <circle cx="320" cy="170" r="90" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="3" />
  <circle cx="320" cy="170" r="75" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="320" cy="170" r="4.5" fill="#0284c7" />
  <text x="330" y="175" font-size="14" font-weight="bold" fill="#0284c7">O₂</text>
  <text x="345" y="140" font-size="12" font-weight="bold" fill="#0284c7">R = 30</text>

  <!-- Ống nhỏ ở khe giữa: tâm O(230, 237.5), r = 22.5px (7.5cm) -->
  <circle cx="230" cy="237.5" r="22.5" fill="rgba(220, 38, 38, 0.25)" stroke="#dc2626" stroke-width="2.5" />
  <circle cx="230" cy="237.5" r="3.5" fill="#dc2626" />
  <text x="226" y="233" font-size="11" font-weight="bold" fill="#dc2626">O</text>
  <text x="220" y="254" font-size="10" font-weight="bold" fill="#dc2626">r = ?</text>

  <!-- Tam giác vuông O1 - H - O:
       O1(140, 170)
       H(140, 237.5)
       O(230, 237.5)
  -->
  <line x1="140" y1="170" x2="230" y2="237.5" stroke="#ea580c" stroke-width="2.5" />
  <text x="175" y="200" font-size="12" font-weight="bold" fill="#ea580c">R + r</text>

  <line x1="140" y1="237.5" x2="230" y2="237.5" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" />
  <text x="175" y="252" font-size="11" font-weight="bold" fill="#16a34a">R = 30</text>

  <line x1="140" y1="170" x2="140" y2="237.5" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" />
  <text x="92" y="210" font-size="11" font-weight="bold" fill="#64748b">R - r</text>

  <!-- Ký hiệu góc vuông tại H -->
  <rect x="140" y="225.5" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5" />
  <circle cx="140" cy="237.5" r="3.5" fill="#16a34a" />
  <text x="125" y="243" font-size="12" font-weight="bold" fill="#16a34a">H</text>

  <!-- Tiếp điểm giữa 2 ống lớn -->
  <circle cx="230" cy="170" r="3.5" fill="#0f172a" />

  <!-- Khung công thức giải bên phải -->
  <g transform="translate(375, 45)">
    <rect x="0" y="0" width="165" height="205" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="165" height="30" rx="10" fill="#dc2626" />
    <text x="82" y="20" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CÔNG THỨC PYTHAGORE</text>

    <text x="10" y="52" font-size="11" fill="#334155">Xét ΔO₁HO vuông tại H:</text>
    <text x="14" y="72" font-size="11" fill="#334155">• O₁O = R + r = 30 + r</text>
    <text x="14" y="92" font-size="11" fill="#334155">• O₁H = R - r = 30 - r</text>
    <text x="14" y="112" font-size="11" fill="#334155">• HO = R = 30</text>

    <line x1="10" y1="124" x2="155" y2="124" stroke="#e2e8f0" stroke-width="1" />

    <text x="10" y="142" font-size="11" fill="#334155">(30 + r)² = 30² + (30 - r)²</text>
    <text x="10" y="162" font-size="11" fill="#334155">120r = 900</text>
    <text x="10" y="185" font-size="13" font-weight="bold" fill="#dc2626">⇒ r = 7,5 cm</text>
  </g>

</svg>