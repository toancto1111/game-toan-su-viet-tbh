<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="crustGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="cheeseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="760" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- TIÊU ĐỀ SO SÁNH -->
  <g transform="translate(380, 36)">
    <rect x="-240" y="-18" width="480" height="38" rx="19" fill="#b45309" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🍕 BÀI TOÁN THỰC TẾ: CHỌN MIẾNG BÁNH PIZZA NÀO LỚN HƠN?
    </text>
  </g>

  <!-- ==================== PIZZA 1: 16cm (6 miếng, góc 60 độ) ==================== -->
  <g transform="translate(190, 195)">
    <!-- Đĩa bánh gỗ -->
    <circle cx="0" cy="0" r="115" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    
    <!-- Khối 5 miếng còn lại (0 đến 300 độ ngược chiều kim đồng hồ) -->
    <!-- Từ 60 độ đến 360 độ (tức 0 độ) -->
    <g filter="url(#shadow)">
      <!-- Vỏ viền bánh -->
      <path d="M 0 0 L 100 0 A 100 100 0 1 1 50 -86.6 Z" fill="url(#crustGrad)" stroke="#92400e" stroke-width="2"/>
      <!-- Lớp phô mai bên trong -->
      <path d="M 0 0 L 88 0 A 88 88 0 1 1 44 -76.2 Z" fill="url(#cheeseGrad)"/>
      <!-- Các rãnh cắt dao chia 6 (120, 180, 240, 300 độ) -->
      <line x1="0" y1="0" x2="-50" y2="-86.6" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="-100" y2="0" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="-50" y2="86.6" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="50" y2="86.6" stroke="#92400e" stroke-width="2"/>
      <!-- Pepperoni trên các lát còn lại -->
      <circle cx="-35" cy="-45" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="-60" cy="15" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="-25" cy="55" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="55" cy="-25" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    </g>

    <!-- MIẾNG BÁNH 1 ĐƯỢC RÚT RA (góc 0 đến 60 độ, dịch góc 30 độ) -->
    <g transform="translate(18, -12)" filter="url(#shadow)">
      <!-- Vỏ viền -->
      <path d="M 0 0 L 100 0 A 100 100 0 0 0 50 -86.6 Z" fill="url(#crustGrad)" stroke="#b91c1c" stroke-width="2.5"/>
      <!-- Phô mai -->
      <path d="M 0 0 L 88 0 A 88 88 0 0 0 44 -76.2 Z" fill="url(#cheeseGrad)"/>
      <!-- Pepperoni trên miếng này -->
      <circle cx="50" cy="-30" r="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <circle cx="65" cy="-15" r="8" fill="#16a34a"/> <!-- lá húng quế -->
      <!-- Nhãn góc 60 độ -->
      <path d="M 30 0 A 30 30 0 0 0 15 -25.9" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="24" y="-8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">60°</text>
      <!-- Nhãn diện tích S1 -->
      <rect x="35" y="-75" width="80" height="24" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
      <text x="75" y="-59" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle">
        S₁ ≈ 33,5 cm²
      </text>
    </g>

    <!-- Nhãn dưới Pizza 1 -->
    <text x="0" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">
      Loại 1: Đường kính 16 cm (chia 6)
    </text>
    <text x="0" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">
      R₁ = 8 cm, n₁ = 60°
    </text>
  </g>

  <!-- ==================== DẤU SO SÁNH Ở GIỮA ==================== -->
  <g transform="translate(380, 200)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="10" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#16a34a" text-anchor="middle">&gt;</text>
  </g>

  <!-- ==================== PIZZA 2: 18cm (8 miếng, góc 45 độ) ==================== -->
  <g transform="translate(560, 195)">
    <!-- Đĩa bánh gỗ -->
    <circle cx="0" cy="0" r="125" fill="#fde68a" stroke="#d97706" stroke-width="2"/>

    <!-- Khối 7 miếng còn lại (45 độ đến 360 độ) -->
    <!-- R = 110 (minh họa R=9cm lớn hơn) -->
    <g filter="url(#shadow)">
      <path d="M 0 0 L 110 0 A 110 110 0 1 1 77.8 -77.8 Z" fill="url(#crustGrad)" stroke="#92400e" stroke-width="2"/>
      <path d="M 0 0 L 98 0 A 98 98 0 1 1 69.3 -69.3 Z" fill="url(#cheeseGrad)"/>
      <!-- Các đường cắt chia 8: 90, 135, 180, 225, 270, 315 -->
      <line x1="0" y1="0" x2="0" y2="-110" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="-77.8" y2="-77.8" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="-110" y2="0" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="-77.8" y2="77.8" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="110" stroke="#92400e" stroke-width="2"/>
      <line x1="0" y1="0" x2="77.8" y2="77.8" stroke="#92400e" stroke-width="2"/>
      <!-- Pepperoni -->
      <circle cx="-35" cy="-60" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="-65" cy="-25" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="-65" cy="40" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="-25" cy="65" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="45" cy="65" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="65" cy="25" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    </g>

    <!-- MIẾNG BÁNH 2 ĐƯỢC RÚT RA (0 đến 45 độ) -->
    <g transform="translate(18, -8)" filter="url(#shadow)">
      <path d="M 0 0 L 110 0 A 110 110 0 0 0 77.8 -77.8 Z" fill="url(#crustGrad)" stroke="#16a34a" stroke-width="2.5"/>
      <path d="M 0 0 L 98 0 A 98 98 0 0 0 69.3 -69.3 Z" fill="url(#cheeseGrad)"/>
      <circle cx="55" cy="-25" r="11" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <circle cx="75" cy="-45" r="8" fill="#16a34a"/>
      <!-- Nhãn góc 45 độ -->
      <path d="M 32 0 A 32 32 0 0 0 22.6 -22.6" fill="none" stroke="#16a34a" stroke-width="2"/>
      <text x="26" y="-6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">45°</text>
      <!-- Nhãn diện tích S2 -->
      <rect x="42" y="-75" width="80" height="24" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="82" y="-59" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#16a34a" text-anchor="middle">
        S₂ ≈ 31,8 cm²
      </text>
    </g>

    <!-- Nhãn dưới Pizza 2 -->
    <text x="0" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">
      Loại 2: Đường kính 18 cm (chia 8)
    </text>
    <text x="0" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">
      R₂ = 9 cm, n₂ = 45°
    </text>
  </g>

  <!-- KẾT LUẬN CUỐI HÌNH -->
  <text x="380" y="380" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    💡 Kết luận: Miếng bánh Loại 1 (33,5 cm²) lớn hơn miếng bánh Loại 2 (31,8 cm²) dù cả chiếc bánh nhỏ hơn!
  </text>
</svg>
