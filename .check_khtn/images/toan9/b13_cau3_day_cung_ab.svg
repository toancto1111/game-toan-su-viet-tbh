<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" style="max-width: 300px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
  </defs>
  
  <circle cx="150" cy="120" r="80" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="150" cy="120" r="4" fill="#0f172a" />
  <text x="145" y="140" font-size="14" font-weight="bold" fill="#0f172a">O</text>

  <!-- A(80, 80), B(220, 80) -->
  <line x1="80" y1="80" x2="220" y2="80" stroke="#dc2626" stroke-width="2.5" />
  <circle cx="80" cy="80" r="4" fill="#dc2626" />
  <circle cx="220" cy="80" r="4" fill="#dc2626" />
  <text x="68" y="78" font-size="14" font-weight="bold" fill="#dc2626">A</text>
  <text x="226" y="78" font-size="14" font-weight="bold" fill="#dc2626">B</text>

  <!-- C ở đáy (150, 200) -->
  <line x1="150" y1="120" x2="150" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="150" cy="200" r="4" fill="#64748b" />
  <text x="155" y="215" font-size="14" font-weight="bold" fill="#64748b">C</text>

</svg>