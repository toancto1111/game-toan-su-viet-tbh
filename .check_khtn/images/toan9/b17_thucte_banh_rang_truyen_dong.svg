<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gear1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gear2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="680" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Tọa độ:
       Tâm A(220, 180), R1 = 120 (đại diện 15cm)
       Tâm B(220 + 200, 180) = (420, 180), R2 = 80 (đại diện 10cm)
       Tiếp điểm tại x = 340, y = 180
       Khoảng cách tâm d = 200 (đại diện 25cm)
  -->

  <!-- BÁNH RĂNG A (Chủ động): R = 120 -->
  <g filter="url(#shadow)">
    <!-- Vành đĩa bánh răng -->
    <circle cx="220" cy="180" r="120" fill="url(#gear1Grad)" stroke="#334155" stroke-width="3"/>
    <circle cx="220" cy="180" r="105" fill="#334155"/>
    <circle cx="220" cy="180" r="95" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

    <!-- Các răng cưa (24 răng tỏa đều 15 độ) -->
    <g stroke="#334155" stroke-width="2">
      <!-- Một số răng cưa mô phỏng chân thực bằng chấu -->
      <circle cx="220" cy="180" r="120" fill="none" stroke="#475569" stroke-width="12" stroke-dasharray="10,6"/>
    </g>

    <!-- 6 chấu đúc trong thân bánh răng -->
    <g stroke="#475569" stroke-width="8" stroke-linecap="round">
      <line x1="220" y1="180" x2="220" y2="95"/>
      <line x1="220" y1="180" x2="220" y2="265"/>
      <line x1="220" y1="180" x2="146" y2="137"/>
      <line x1="220" y1="180" x2="294" y2="223"/>
      <line x1="220" y1="180" x2="146" y2="223"/>
      <line x1="220" y1="180" x2="294" y2="137"/>
    </g>

    <!-- Lỗ trục khoan A -->
    <circle cx="220" cy="180" r="24" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="220" cy="180" r="8" fill="#ef4444"/>

    <!-- Mũi tên quay theo chiều kim đồng hồ -->
    <path d="M 170 80 A 110 110 0 0 1 270 80" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="275,85 260,75 268,90" fill="#ef4444"/>
  </g>

  <!-- BÁNH RĂNG B (Bị động): R = 80 -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="180" r="80" fill="url(#gear2Grad)" stroke="#334155" stroke-width="2.5"/>
    <circle cx="420" cy="180" r="70" fill="#334155"/>
    <circle cx="420" cy="180" r="62" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <circle cx="420" cy="180" r="80" fill="none" stroke="#475569" stroke-width="10" stroke-dasharray="8,5"/>

    <!-- 4 chấu đúc -->
    <g stroke="#475569" stroke-width="6" stroke-linecap="round">
      <line x1="420" y1="180" x2="420" y2="120"/>
      <line x1="420" y1="180" x2="420" y2="240"/>
      <line x1="420" y1="180" x2="360" y2="180"/>
      <line x1="420" y1="180" x2="480" y2="180"/>
    </g>

    <!-- Lỗ trục khoan B -->
    <circle cx="420" cy="180" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="420" cy="180" r="6" fill="#0284c7"/>

    <!-- Mũi tên quay ngược chiều kim đồng hồ -->
    <path d="M 460 110 A 70 70 0 0 0 380 110" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <polygon points="375,115 390,105 382,120" fill="#0284c7"/>
  </g>

  <!-- ĐOẠN NỐI TÂM d = AB -->
  <line x1="220" y1="180" x2="420" y2="180" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Tiếp điểm ăn khớp -->
  <circle cx="340" cy="180" r="5" fill="#16a34a"/>
  <rect x="305" y="145" width="70" height="22" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">
    Tiếp điểm
  </text>

  <!-- Ký hiệu tâm A, B -->
  <text x="220" y="218" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  <text x="420" y="214" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Nhãn bán kính R1 và R2 -->
  <text x="260" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">R₁ = 15cm</text>
  <text x="360" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">R₂ = 10cm</text>

  <!-- Hộp kích thước khoảng cách trục khoan phía dưới -->
  <g transform="translate(320, 310)" filter="url(#shadow)">
    <rect x="-190" y="-18" width="380" height="36" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">
      Khoảng cách hai trục: d = R₁ + R₂ = 15 + 10 = 25 cm
    </text>
  </g>

  <text x="340" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Hình 17.2 — Hai bánh răng tiếp xúc ngoài: Khoảng cách tâm trục đúng bằng tổng hai bán kính
  </text>
</svg>
