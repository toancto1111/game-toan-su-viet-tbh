<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="100%" height="100%" style="max-width: 500px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- VÒNG QUAY A (3 SỐ) -->
  <g filter="url(#shadow2)">
    <path d="M 130 110 L 130.00 30.00 A 80 80 0 0 0 60.72 150.00 Z" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <path d="M 130 110 L 60.72 150.00 A 80 80 0 0 0 199.28 150.00 Z" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    <path d="M 130 110 L 199.28 150.00 A 80 80 0 0 0 130.00 30.00 Z" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="130" cy="110" r="80" fill="none" stroke="#1f2937" stroke-width="3"/>
  </g>

  <!-- Số vòng A -->
  <text x="88.43" y="86.00" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="130.00" y="158.00" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="171.57" y="86.00" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>

  <!-- Kim vòng A -->
  <g>
    <line x1="130" y1="110" x2="130" y2="55" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="130,45 123,60 137,60" fill="#dc2626"/>
    <circle cx="130" cy="110" r="5" fill="#111827"/>
  </g>

  <text x="130" y="215" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Vòng quay A (3 số)</text>

  <!-- DẤU NHÂN -->
  <text x="250" y="118" font-size="36" font-weight="bold" fill="#6b7280" text-anchor="middle">×</text>

  <!-- VÒNG QUAY B (5 SỐ) -->
  <g filter="url(#shadow2)">
    <path d="M 370 110 L 370.00 30.00 A 80 80 0 0 0 293.92 85.28 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <path d="M 370 110 L 293.92 85.28 A 80 80 0 0 0 322.98 174.72 Z" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <path d="M 370 110 L 322.98 174.72 A 80 80 0 0 0 417.02 174.72 Z" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <path d="M 370 110 L 417.02 174.72 A 80 80 0 0 0 446.08 85.28 Z" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <path d="M 370 110 L 446.08 85.28 A 80 80 0 0 0 370.00 30.00 Z" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <circle cx="370" cy="110" r="80" fill="none" stroke="#1f2937" stroke-width="3"/>
  </g>

  <!-- Số vòng B -->
  <text x="339.44" y="67.93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="320.55" y="126.07" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="370.00" y="162.00" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="419.45" y="126.07" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="400.56" y="67.93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>

  <!-- Kim vòng B -->
  <g>
    <line x1="370" y1="110" x2="370" y2="55" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="370,45 363,60 377,60" fill="#dc2626"/>
    <circle cx="370" cy="110" r="5" fill="#111827"/>
  </g>

  <text x="370" y="215" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Vòng quay B (5 số)</text>

  <!-- Chú thích -->
  <text x="250" y="255" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Không gian mẫu gồm 3 × 5 = 15 cặp ô kết quả đồng khả năng</text>
</svg>