<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%" style="max-width: 440px; max-height: 260px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="430" height="250" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Các vòng tròn đồng tâm xanh lá neon tâm O(200, 130) -->
  <circle cx="200" cy="130" r="35" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6" />
  <circle cx="200" cy="130" r="70" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6" />
  <circle cx="200" cy="130" r="105" fill="none" stroke="#22c55e" stroke-width="1.8" />
  
  <!-- Trục tọa độ chữ thập -->
  <line x1="90" y1="130" x2="310" y2="130" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />
  <line x1="200" y1="20" x2="200" y2="240" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />
  
  <!-- Hướng Bắc N (0 độ) tại đỉnh (200, 25) -->
  <text x="200" y="18" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">N (0° - Hướng Bắc)</text>

  <!-- Quạt quét từ hướng Bắc (góc -90 độ trong canvas) theo chiều kim đồng hồ 150 độ tới góc 60 độ -->
  <!-- Arc từ (200, 25) theo chiều SVG (clockwise, large-arc=0 vì 150 < 180) -->
  <!-- Điểm kết thúc: x = 200 + 105*cos(60) = 200 + 52.5 = 252.5 -->
  <!-- y = 130 + 105*sin(60) = 130 + 90.9 = 220.9 -->
  <path d="M 200 130 L 200 25 A 105 105 0 0 1 252.5 220.9 Z" fill="rgba(34, 197, 94, 0.25)" />
  <line x1="200" y1="130" x2="200" y2="25" stroke="#4ade80" stroke-width="2.5" />
  <line x1="200" y1="130" x2="252.5" y2="220.9" stroke="#4ade80" stroke-width="2.5" />

  <!-- Cung quét sáng nổi bật trên đường tròn bán kính 70 (vị trí 40km) -->
  <!-- Bán kính 70: từ (200, 60) đến (200 + 70*cos(60), 130 + 70*sin(60)) = (235, 190.6) -->
  <path d="M 200 60 A 70 70 0 0 1 235 190.6" fill="none" stroke="#facc15" stroke-width="3.5" />

  <!-- Cung đo góc 150 độ gần tâm -->
  <path d="M 200 100 A 30 30 0 0 1 215 156" fill="none" stroke="#facc15" stroke-width="2" />
  <text x="228" y="115" font-size="13" font-weight="bold" fill="#facc15">150°</text>

  <!-- Tâm O -->
  <circle cx="200" cy="130" r="4.5" fill="#4ade80" />
  <text x="185" y="145" font-size="13" font-weight="bold" fill="#4ade80">O</text>

  <!-- Vị trí máy bay Flight VN234 tại (235, 190.6) -->
  <circle cx="235" cy="190.6" r="5" fill="#ef4444" />
  <!-- Biểu tượng máy bay nhỏ -->
  <g transform="translate(235, 190.6) rotate(60)">
    <polygon points="0,-8 5,5 0,3 -5,5" fill="#f87171" />
  </g>
  <rect x="250" y="182" width="105" height="22" rx="4" fill="#991b1b" opacity="0.8" />
  <text x="302" y="197" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Flight VN234</text>

  <!-- Bảng chú thích góc quét -->
  <text x="330" y="55" font-size="13" font-weight="bold" fill="#facc15">Cung quét = 150°</text>
  <text x="330" y="75" font-size="11" fill="#94a3b8">Bán kính: 40 km</text>
  <text x="330" y="93" font-size="11" fill="#94a3b8">Quét: 5/12 vùng trời</text>

</svg>