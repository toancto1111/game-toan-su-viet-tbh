<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" style="max-width: 320px; max-height: 280px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <polygon points="208,48 255,130 208,212 112,212 65,130 112,48" fill="rgba(37, 99, 235, 0.06)" stroke="#2563eb" stroke-width="3" />
  
  <!-- Xuất phát từ đỉnh A (208, 48) -->
  <line x1="208" y1="48" x2="208" y2="212" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="208" y1="48" x2="112" y2="212" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="208" y1="48" x2="65" y2="130" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Nổi bật đỉnh A -->
  <circle cx="208" cy="48" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <text x="220" y="44" font-size="16" font-weight="bold" fill="#dc2626">A (Đỉnh xuất phát)</text>
  <text x="268" y="135" font-size="14" font-weight="bold" fill="#64748b">B</text>
  <text x="218" y="228" font-size="14" font-weight="bold" fill="#dc2626">C</text>
  <text x="98" y="228" font-size="14" font-weight="bold" fill="#16a34a">D</text>
  <text x="45" y="135" font-size="14" font-weight="bold" fill="#9333ea">E</text>
  <text x="95" y="44" font-size="14" font-weight="bold" fill="#64748b">F</text>

  <rect x="40" y="245" width="240" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="160" y="262" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Số đường chéo từ 1 đỉnh = 6 - 3 = 3</text>

</svg>