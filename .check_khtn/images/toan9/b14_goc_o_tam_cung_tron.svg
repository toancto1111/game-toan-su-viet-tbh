<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%" style="max-width: 440px; max-height: 260px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="430" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn O(170, 130), R = 85 -->
  <!-- Quạt góc ở tâm AOB tô màu cam nhạt (từ 30 độ đến 135 độ) -->
  <!-- Arc trong SVG: từ A(170 + 85*cos(-30), 130 + 85*sin(-30)) = (243.6, 87.5) -->
  <!-- đến B(170 + 85*cos(-135), 130 + 85*sin(-135)) = (109.9, 69.9) -->
  <path d="M 170 130 L 243.6 87.5 A 85 85 0 0 0 109.9 69.9 Z" fill="rgba(234, 88, 12, 0.15)" />
  
  <!-- Đường tròn nền nét mảnh -->
  <circle cx="170" cy="130" r="85" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Cung nhỏ AB màu cam đậm -->
  <path d="M 243.6 87.5 A 85 85 0 0 0 109.9 69.9" fill="none" stroke="#ea580c" stroke-width="4.5" />

  <!-- Cung lớn AmB màu xanh lá đậm -->
  <path d="M 109.9 69.9 A 85 85 0 1 0 243.6 87.5" fill="none" stroke="#009650" stroke-width="4.5" />
  
  <!-- Điểm m trên cung lớn -->
  <circle cx="170" cy="215" r="3.5" fill="#009650" />
  <text x="175" y="218" font-size="13" font-weight="bold" fill="#009650">m</text>

  <!-- Bán kính OA và OB -->
  <line x1="170" y1="130" x2="243.6" y2="87.5" stroke="#0050b4" stroke-width="2.5" />
  <line x1="170" y1="130" x2="109.9" y2="69.9" stroke="#0050b4" stroke-width="2.5" />

  <!-- Tâm O -->
  <circle cx="170" cy="130" r="4.5" fill="#dc2626" />
  <text x="170" y="152" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">O</text>

  <!-- Đỉnh A và B -->
  <circle cx="243.6" cy="87.5" r="4.5" fill="#0050b4" />
  <text x="255" y="92" font-size="15" font-weight="bold" fill="#0050b4">A</text>

  <circle cx="109.9" cy="69.9" r="4.5" fill="#0050b4" />
  <text x="92" y="70" font-size="15" font-weight="bold" fill="#0050b4">B</text>

  <!-- Cung góc alpha tại tâm -->
  <path d="M 195 115 A 30 30 0 0 0 148 108" fill="none" stroke="#dc2626" stroke-width="2" />
  <text x="172" y="105" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">α</text>

  <!-- Hộp giải thích bên phải -->
  <g transform="translate(285, 45)">
    <rect x="0" y="0" width="145" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="12" y="28" font-size="12" font-weight="bold" fill="#dc2626">• Góc ở tâm: ∠AOB = α</text>
    
    <line x1="8" y1="42" x2="137" y2="42" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="12" y="65" font-size="12" font-weight="bold" fill="#ea580c">• Cung nhỏ AB:</text>
    <text x="16" y="85" font-size="12.5" font-weight="bold" fill="#ea580c">sđ(AB) = α</text>

    <line x1="8" y1="102" x2="137" y2="102" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="12" y="125" font-size="12" font-weight="bold" fill="#009650">• Cung lớn AmB:</text>
    <text x="16" y="145" font-size="12" font-weight="bold" fill="#009650">sđ = 360° - α</text>
  </g>

</svg>