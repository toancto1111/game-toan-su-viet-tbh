<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="max-width: 400px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="390" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn tâm O(190, 130), R = 80 -->
  <circle cx="190" cy="130" r="80" fill="rgba(0, 80, 180, 0.05)" stroke="#0050b4" stroke-width="2" />
  <circle cx="190" cy="130" r="4" fill="#dc2626" />
  <text x="190" y="152" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">O</text>

  <!-- Tam giác AOB: A(140 độ), B(20 độ) -->
  <!-- A: (190 - 80*cos(40), 130 - 80*sin(40)) = (128.7, 78.6) -->
  <!-- B: (190 + 80*cos(20), 130 - 80*sin(20)) = (265.2, 102.6) -->
  <polygon points="128.7,78.6 265.2,102.6 190,130" fill="rgba(0, 150, 80, 0.08)" />

  <!-- Dây AB -->
  <line x1="128.7" y1="78.6" x2="265.2" y2="102.6" stroke="#009650" stroke-width="2.5" />
  <text x="197" y="82" font-size="13" font-weight="bold" fill="#009650" text-anchor="middle">Dây AB</text>

  <!-- Bán kính OA và OB nét đứt đỏ -->
  <line x1="190" y1="130" x2="128.7" y2="78.6" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <text x="148" y="112" font-size="13" font-weight="bold" fill="#dc2626">R</text>

  <line x1="190" y1="130" x2="265.2" y2="102.6" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <text x="234" y="125" font-size="13" font-weight="bold" fill="#dc2626">R</text>

  <!-- Điểm A và B -->
  <circle cx="128.7" cy="78.6" r="4" fill="#0050b4" />
  <text x="115" y="75" font-size="14" font-weight="bold" fill="#0050b4">A</text>

  <circle cx="265.2" cy="102.6" r="4" fill="#0050b4" />
  <text x="275" y="105" font-size="14" font-weight="bold" fill="#0050b4">B</text>

  <!-- Dòng công thức BĐT tam giác -->
  <rect x="25" y="185" width="350" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="200" y="206" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Trong ΔAOB: AB &lt; OA + OB = R + R = 2R (Dấu "=" khi AB qua O)</text>

</svg>