<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="520" height="300" rx="14" fill="url(#bgGrad)"/>

  <!-- Tâm O tại (120, 150), R = 60 (đại diện cho 5cm) -->
  <circle cx="120" cy="150" r="60" fill="#eff6ff" stroke="#0284c7" stroke-width="2.5"/>
  
  <!-- Điểm A tại (380, 150) (khoảng cách 260px đại diện cho 13cm) -->
  <!-- Đường thẳng OA -->
  <line x1="120" y1="150" x2="380" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="210" y="136" width="90" height="24" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="255" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
    OA = 13 cm
  </text>

  <!-- Bán kính R = 5cm vẽ xiên -->
  <line x1="120" y1="150" x2="162.4" y2="107.6" stroke="#dc2626" stroke-width="2"/>
  <circle cx="162.4" cy="107.6" r="3" fill="#dc2626"/>
  <text x="132" y="120" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#dc2626">R = 5</text>

  <!-- Đường thẳng d thẳng đứng qua A (380, 150) -->
  <line x1="380" y1="30" x2="380" y2="270" stroke="#9333ea" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="395" y="45" font-family="system-ui, sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#9333ea">d</text>

  <!-- Góc vuông tại A -->
  <rect x="365" y="150" width="15" height="15" fill="none" stroke="#9333ea" stroke-width="2"/>

  <!-- Điểm O và A -->
  <circle cx="120" cy="150" r="4.5" fill="#0284c7"/>
  <text x="105" y="155" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

  <circle cx="380" cy="150" r="4.5" fill="#9333ea"/>
  <text x="395" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#9333ea">A</text>

  <!-- Hộp kết luận -->
  <g transform="translate(250, 240)" filter="url(#shadow)">
    <rect x="-140" y="-15" width="280" height="30" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="middle">
      d = OA = 13 cm &gt; R = 5 cm ⟹ Không giao nhau
    </text>
  </g>

  <text x="260" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Ví dụ 1 — So sánh khoảng cách từ tâm d = 13 cm với bán kính R = 5 cm
  </text>
</svg>
