<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <text x="310" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Quỹ đạo bóng rổ: y = −0,098x² + x + 1,5</text>
  <!-- Ground -->
  <rect x="40" y="270" width="560" height="8" rx="2" fill="#6a4" opacity="0.7"/>
  <!-- Axes -->
  <line x1="55" y1="275" x2="55" y2="40" stroke="#555" stroke-width="1.5" marker-end="url(#arax)"/>
  <line x1="50" y1="270" x2="605" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arax)"/>
  <defs>
    <marker id="arax" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
  </defs>
  <text x="610" y="274" font-size="11" fill="#555">x (m)</text>
  <text x="60" y="36" font-size="11" fill="#555">y (m)</text>
  <text x="48" y="275" font-size="11" fill="#555">O</text>
  <!-- Grid -->
  <g stroke="#ddd" stroke-width="0.5">
    <line x1="55" y1="220" x2="600" y2="220"/><text x="42" y="224" font-size="10" fill="#888">1</text>
    <line x1="55" y1="170" x2="600" y2="170"/><text x="42" y="174" font-size="10" fill="#888">2</text>
    <line x1="55" y1="120" x2="600" y2="120"/><text x="42" y="124" font-size="10" fill="#888">3</text>
    <line x1="55" y1="70" x2="600" y2="70"/><text x="42" y="74" font-size="10" fill="#888">4</text>
    <!-- x grid lines at 2,4,6,8,10,12 (40px each) -->
    <line x1="135" y1="40" x2="135" y2="270"/><text x="131" y="284" font-size="10" fill="#888">2</text>
    <line x1="215" y1="40" x2="215" y2="270"/><text x="211" y="284" font-size="10" fill="#888">4</text>
    <line x1="295" y1="40" x2="295" y2="270"/><text x="291" y="284" font-size="10" fill="#888">6</text>
    <line x1="375" y1="40" x2="375" y2="270"/><text x="371" y="284" font-size="10" fill="#888">8</text>
    <line x1="455" y1="40" x2="455" y2="270"/><text x="448" y="284" font-size="10" fill="#888">10</text>
    <line x1="535" y1="40" x2="535" y2="270"/><text x="528" y="284" font-size="10" fill="#888">12</text>
  </g>
  <!-- Parabol path: scale x*40+55, y mapped: 1m=50px, 0 at y=270 -->
  <!-- y = -0.098*x^2 + x + 1.5 => screen_y = 270 - y*50 -->
  <!-- Points: (0,1.5)->(55,195), (2,3.11)->(135,114), (4,3.93)->(215,73.5), (5.1,4.05)~peak, (8,2.57)->(375,141), (10,1.3)->(455,205), (11.53,0)->(516,270) -->
  <path d="M55,195 C95,140 135,95 175,73 C215,51 255,48 295,60 C335,71 375,110 415,150 C450,186 480,222 516,270" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <!-- Key points -->
  <circle cx="55" cy="195" r="5" fill="#e53935"/>
  <text x="20" y="193" font-size="11" font-weight="bold" fill="#e53935">A(0; 1,5)</text>
  <!-- Peak approx x=5.1, y=4.05 -->
  <circle cx="258" cy="67" r="4" fill="#f57f17"/>
  <text x="262" y="62" font-size="11" fill="#f57f17">≈4,05 m (đỉnh)</text>
  <!-- Land point -->
  <circle cx="516" cy="270" r="5" fill="#e53935"/>
  <text x="520" y="266" font-size="11" font-weight="bold" fill="#e53935">B(11,53; 0)</text>
  <!-- Horizontal arrow -->
  <line x1="55" y1="302" x2="516" y2="302" stroke="#1565c0" stroke-width="1.5" marker-start="url(#arax)" marker-end="url(#arax)"/>
  <text x="285" y="318" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">Tầm bay ngang ≈ 11,53 m</text>
  <!-- Height at start -->
  <line x1="55" y1="195" x2="55" y2="270" stroke="#e53935" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="22" y="235" font-size="10" fill="#e53935">1,5 m</text>
  <!-- Basketball icon -->
  <circle cx="516" cy="258" r="9" fill="#ef6c00"/>
  <line x1="507" y1="258" x2="525" y2="258" stroke="#7b3200" stroke-width="1"/>
  <line x1="516" y1="249" x2="516" y2="267" stroke="#7b3200" stroke-width="1"/>
</svg>
