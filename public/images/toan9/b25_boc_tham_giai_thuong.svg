<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" style="max-width: 540px; max-height: 280px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Glass box gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Paper ballots gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- Podium gradients -->
    <linearGradient id="goldPodium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silverPodium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0050b3; text-anchor: middle; }
    .ticket-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .podium-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .podium-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #fef08a; text-anchor: middle; }
    .note-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .arrow-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #ea580c; text-anchor: middle; }
  </style>

  <rect x="10" y="10" width="520" height="260" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="270" y="36" class="header-text">Mô hình bốc thăm phân định 2 giải thưởng từ 4 khách hàng (A, B, C, D)</text>

  <!-- HÒM PHIẾU TRONG SUỐT (Left) -->
  <g transform="translate(45, 65)">
    <!-- Ballot Box 3D perspective -->
    <polygon points="15,35 155,35 175,10 35,10" fill="#e0f2fe" opacity="0.6" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="155,35 175,10 175,115 155,140" fill="#bae6fd" opacity="0.5" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="15" y="35" width="140" height="105" rx="4" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)"/>

    <!-- 4 Lá phiếu bên trong -->
    <!-- Phiếu A -->
    <rect x="30" y="55" width="48" height="26" rx="4" fill="url(#ticketGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="54" y="68" class="ticket-text">Phiếu A</text>

    <!-- Phiếu B -->
    <rect x="95" y="60" width="48" height="26" rx="4" fill="url(#ticketGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="119" y="73" class="ticket-text">Phiếu B</text>

    <!-- Phiếu C -->
    <rect x="42" y="95" width="48" height="26" rx="4" fill="url(#ticketGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="66" y="108" class="ticket-text">Phiếu C</text>

    <!-- Phiếu D -->
    <rect x="100" y="100" width="48" height="26" rx="4" fill="url(#ticketGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="124" y="113" class="ticket-text">Phiếu D</text>

    <text x="85" y="165" class="note-text">Hòm phiếu (Không hoàn lại)</text>
  </g>

  <!-- MŨI TÊN CHỈ DẪN RÚT THĂM -->
  <g transform="translate(235, 115)">
    <path d="M 0 10 L 50 10" stroke="#ea580c" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="50,4 62,10 50,16" fill="#ea580c"/>
    <text x="28" y="-5" class="arrow-text">Rút lần 1</text>
    <text x="28" y="32" class="arrow-text">rồi lần 2</text>
  </g>

  <!-- BỤC GIẢI THƯỞNG (Right) -->
  <g transform="translate(325, 80)">
    <!-- Bục Giải Đặc Biệt (Cao hơn) -->
    <rect x="10" y="20" width="85" height="100" rx="6" fill="url(#goldPodium)" stroke="#b45309" stroke-width="2" filter="url(#boxShadow)"/>
    <circle cx="52" cy="48" r="16" fill="#ffffff" opacity="0.3"/>
    <text x="52" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>
    <text x="52" y="78" class="podium-title">GIẢI</text>
    <text x="52" y="95" class="podium-sub">ĐẶC BIỆT</text>

    <!-- Bục Giải Nhất (Thấp hơn) -->
    <rect x="105" y="55" width="85" height="65" rx="6" fill="url(#silverPodium)" stroke="#475569" stroke-width="2" filter="url(#boxShadow)"/>
    <circle cx="147" cy="78" r="14" fill="#ffffff" opacity="0.25"/>
    <text x="147" y="83" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <text x="147" y="105" class="podium-title" style="font-size: 13px;">GIẢI NHẤT</text>

    <!-- Mặt sàn bục -->
    <rect x="0" y="120" width="200" height="8" rx="3" fill="#334155"/>
    <text x="100" y="150" class="note-text">Phân bổ 2 giải: n(Ω) = 4 × 3 = 12</text>
  </g>
</svg>
