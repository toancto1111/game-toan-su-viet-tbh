<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="100%" height="100%" style="max-width: 460px; max-height: 270px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="450" height="260" rx="12" fill="#fcfaf8" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn gốc khôi phục nét chấm mờ tâm O(230, 140), R = 95 -->
  <circle cx="230" cy="140" r="95" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Mảnh vỡ gốm sứ với viền ngoài là cung tròn từ góc 30 độ đến 150 độ (nửa trên) -->
  <!-- Cung tròn viền đĩa từ (230 - 95*cos(30), 140 - 95*sin(30)) = (147.7, 92.5) lên đỉnh (230, 45) tới (312.3, 92.5) -->
  <path d="M 147.7 92.5 A 95 95 0 0 1 312.3 92.5 
           L 290 125 L 260 105 L 230 130 L 200 110 L 170 125 Z" 
        fill="#fed7aa" stroke="#c2410c" stroke-width="2" />

  <!-- 3 điểm A, B, C trên viền cong của mảnh vỡ -->
  <!-- A: góc 135 độ -> (230 - 95*cos(45), 140 - 95*sin(45)) = (162.8, 72.8) -->
  <!-- B: góc 90 độ -> (230, 45) -->
  <!-- C: góc 45 độ -> (230 + 95*cos(45), 140 - 95*sin(45)) = (297.2, 72.8) -->
  
  <!-- Hai dây cung AB và BC -->
  <line x1="162.8" y1="72.8" x2="230" y2="45" stroke="#0050b4" stroke-width="2.5" />
  <line x1="230" y1="45" x2="297.2" y2="72.8" stroke="#0050b4" stroke-width="2.5" />

  <!-- Trung trực của dây AB (đi qua O(230, 140)) -->
  <line x1="170" y1="30" x2="245" y2="165" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Trung trực của dây BC (đi qua O(230, 140)) -->
  <line x1="290" y1="30" x2="215" y2="165" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Giao điểm O(230, 140) là tâm đĩa -->
  <circle cx="230" cy="140" r="5" fill="#dc2626" />
  <text x="238" y="155" font-size="16" font-weight="bold" fill="#dc2626">O (Tâm đĩa)</text>

  <!-- Điểm A, B, C -->
  <circle cx="162.8" cy="72.8" r="4.5" fill="#dc2626" />
  <text x="145" y="70" font-size="15" font-weight="bold" fill="#dc2626">A</text>

  <circle cx="230" cy="45" r="4.5" fill="#dc2626" />
  <text x="225" y="35" font-size="15" font-weight="bold" fill="#dc2626">B</text>

  <circle cx="297.2" cy="72.8" r="4.5" fill="#dc2626" />
  <text x="305" y="70" font-size="15" font-weight="bold" fill="#dc2626">C</text>

  <!-- Chú thích quy trình phục dựng -->
  <rect x="20" y="195" width="410" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
  <text x="225" y="215" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">PHỤC DỰNG ĐĨA CỔ BẰNG THUẬT TOÁN 3 ĐIỂM (3-POINT CIRCLE)</text>
  <text x="225" y="233" font-size="11.5" fill="#475569" text-anchor="middle">Trung trực của dây AB và BC cắt nhau chính xác tại Tâm O của chiếc đĩa gốc</text>

</svg>