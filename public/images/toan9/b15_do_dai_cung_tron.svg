<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="500" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Tâm O (240, 190), R = 120 -->
  <!-- Đường tròn mờ -->
  <circle cx="240" cy="190" r="120" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Góc: 20 deg và 130 deg (lưu ý hệ toạ độ SVG: y hướng xuống) -->
  <!-- 20 deg: cos(20)=0.9397, sin(20)=-0.342 => x = 240 + 120*0.9397 = 352.8, y = 190 - 120*0.342 = 149.0 -->
  <!-- 130 deg: cos(130)=-0.6428, sin(130)=0.766 => x = 240 - 120*0.6428 = 162.9, y = 190 - 120*0.766 = 98.1 -->

  <!-- Quạt góc tô màu nhạt -->
  <path d="M 240 190 L 352.8 149 A 120 120 0 0 0 162.9 98.1 Z" fill="#fed7aa" fill-opacity="0.5"/>

  <!-- Bán kính OA và OB -->
  <line x1="240" y1="190" x2="352.8" y2="149" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="240" y1="190" x2="162.9" y2="98.1" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Cung tròn l (dày, màu đỏ) -->
  <path d="M 352.8 149 A 120 120 0 0 0 162.9 98.1" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Vòng cung góc ở tâm n độ -->
  <path d="M 272.9 178 A 35 35 0 0 0 217.5 163.2" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="245" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">n°</text>

  <!-- Nhãn bán kính R -->
  <text x="305" y="185" font-family="system-ui, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#0284c7">R</text>
  <text x="190" y="140" font-family="system-ui, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#0284c7">R</text>

  <!-- Điểm O, A, B -->
  <circle cx="240" cy="190" r="4" fill="#0284c7"/>
  <text x="240" y="212" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>

  <circle cx="352.8" cy="149" r="4" fill="#0284c7"/>
  <text x="368" y="153" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A</text>

  <circle cx="162.9" cy="98.1" r="4" fill="#0284c7"/>
  <text x="148" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">B</text>

  <!-- Hộp công thức độ dài cung -->
  <g transform="translate(250, 40)" filter="url(#shadow)">
    <rect x="-110" y="-20" width="220" height="42" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">
      l = <tspan font-style="italic">n</tspan> · π · <tspan font-style="italic">R</tspan> / 180
    </text>
  </g>

  <!-- Chú thích chân hình -->
  <text x="250" y="335" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Hình 15.1 — Độ dài cung l tỉ lệ thuận với số đo góc ở tâm n° và bán kính R
  </text>
</svg>
