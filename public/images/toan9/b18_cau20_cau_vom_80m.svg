<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="100%" height="100%" style="max-width: 560px; max-height: 320px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="550" height="310" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="280" y="26" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">CẦU VÒM PARABOL NHỊP 80m, CAO 20m (CÂU 20)</text>

  <!-- Mặt nước -->
  <rect x="25" y="240" width="510" height="50" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="20" y1="240" x2="540" y2="240" stroke="#0284c7" stroke-width="2" />
  <text x="280" y="270" font-size="12" fill="#0284c7" text-anchor="middle">MẶT NƯỚC</text>

  <!-- Cầu vòm: nhịp 80m ~ 360px (từ x=100 đến x=460), đỉnh tại (280, 80) cao 20m ~ 160px -->
  <path d="M 100 240 Q 280 70 460 240" fill="none" stroke="#d97706" stroke-width="4" />

  <!-- Đỉnh vòm O(280, 80) -->
  <circle cx="280" cy="80" r="4.5" fill="#dc2626" />
  <text x="280" y="70" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Đỉnh vòm (20m)</text>

  <!-- Chiều cao 20m từ đỉnh xuống mặt nước -->
  <line x1="280" y1="80" x2="280" y2="240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="285" y="160" font-size="11" font-weight="bold" fill="#dc2626">20 m</text>

  <!-- Nhịp 80m giữa 2 chân cầu -->
  <circle cx="100" cy="240" r="4" fill="#059669" />
  <circle cx="460" cy="240" r="4" fill="#059669" />
  <line x1="100" y1="250" x2="460" y2="250" stroke="#059669" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)" />
  <text x="280" y="264" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">Nhịp cầu rộng 80 m</text>

  <!-- Điểm cách chân cầu 20m (tức x_px = 100 + 90 = 190, cách tâm 20m = 90px) -->
  <!-- Chiều cao tại đó: y = 20 - (1/80)*(20)^2 = 15m (y_px = 240 - 120 = 120) -->
  <line x1="190" y1="120" x2="190" y2="240" stroke="#ea580c" stroke-width="2.5" />
  <circle cx="190" cy="120" r="4.5" fill="#ea580c" />
  <text x="145" y="175" font-size="12" font-weight="bold" fill="#ea580c">h = 15 m</text>

  <line x1="100" y1="225" x2="190" y2="225" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="145" y="220" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">20 m</text>

  <!-- Khung tính toán bên phải -->
  <g transform="translate(370, 45)">
    <rect x="0" y="0" width="170" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="10" y="20" font-size="11" font-weight="bold" fill="#0f172a">Giải toán:</text>
    <text x="10" y="40" font-size="10.5" fill="#334155">• Đỉnh vòm O(0; 0)</text>
    <text x="10" y="60" font-size="10.5" fill="#334155">• Chân: (40; -20)</text>
    <text x="10" y="80" font-size="10.5" fill="#334155">• a = -20/40² = -1/80</text>
    <text x="10" y="100" font-size="10.5" fill="#334155">• Cách tâm 20 m:</text>
    <text x="14" y="118" font-size="10.5" fill="#334155">y = -(1/80)·20² = -5 m</text>
    <text x="10" y="138" font-size="11.5" font-weight="bold" fill="#ea580c">⇒ Cao: 20 - 5 = 15 m</text>
  </g>

</svg>