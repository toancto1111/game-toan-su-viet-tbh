<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="30%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Nền trời -->
  <rect width="720" height="420" rx="16" fill="url(#skyGrad)"/>

  <!-- Trái Đất (Cung cong lớn): Tâm O nằm sâu bên dưới (260, 1100), R = 850 -->
  <!-- Đỉnh cong tại x = 260, y = 1100 - 850 = 250 -->
  <path d="M -50 450 A 850 850 0 0 1 650 330 L 650 450 Z" fill="url(#earthGrad)" stroke="#0369a1" stroke-width="3"/>

  <!-- Ngọn hải đăng tại đỉnh đảo (260, 250) -->
  <g transform="translate(260, 250)">
    <!-- Đảo đá chân hải đăng -->
    <path d="M -30 0 Q 0 -10 30 0 Z" fill="#78716c"/>
    <!-- Tháp hải đăng -->
    <polygon points="-10,0 10,0 6,-80 -6,-80" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <!-- Các dải sơn đỏ -->
    <polygon points="-9,-20 9,-20 8,-40 -8,-40" fill="#ef4444"/>
    <polygon points="-7,-60 7,-60 6,-75 -6,-75" fill="#ef4444"/>
    <!-- Đèn hải đăng -->
    <rect x="-8" y="-95" width="16" height="15" rx="3" fill="#facc15" stroke="#475569" stroke-width="1.5"/>
    <polygon points="-12,-95 12,-95 0,-108" fill="#334155"/>
    <!-- Tia sáng ngọn hải đăng -->
    <polygon points="0,-88 120,-110 130,-70" fill="#fef08a" fill-opacity="0.5"/>
  </g>

  <!-- Vị trí mắt M ở đỉnh tháp hải đăng: (260, 155) -->
  <!-- Độ cao h = 50m -->
  <line x1="220" y1="250" x2="220" y2="155" stroke="#ef4444" stroke-width="2"/>
  <polyline points="215,245 220,250 225,245" fill="none" stroke="#ef4444" stroke-width="2"/>
  <polyline points="215,160 220,155 225,160" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="208" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="end">h = 50 m</text>

  <!-- Điểm tiếp xúc H (Đường chân trời) tại (530, 280) -->
  <!-- Tia nhìn tiếp tuyến MH: từ (260, 155) đến (530, 280) kéo dài sang (640, 330) -->
  <line x1="260" y1="155" x2="620" y2="322" stroke="#ea580c" stroke-width="3.5" filter="url(#shadow)"/>
  
  <!-- Bán kính OH từ tâm Trái Đất lên tiếp điểm H -->
  <!-- Góc vuông tại H giữa OH và MH -->
  <line x1="530" y1="280" x2="440" y2="400" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="445" y="380" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#dc2626">R = 6400 km</text>

  <!-- Ký hiệu góc vuông tại H -->
  <!-- Vector tiếp tuyến: (270, 125) -> hướng góc khoảng 25 độ -->
  <rect x="520" y="270" width="12" height="12" transform="rotate(25 520 270)" fill="none" stroke="#dc2626" stroke-width="2"/>

  <!-- Điểm M và H -->
  <circle cx="260" cy="155" r="5" fill="#0284c7"/>
  <text x="260" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0369a1" text-anchor="middle">Mắt M</text>

  <circle cx="530" cy="280" r="5" fill="#16a34a"/>
  <text x="545" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#15803d">Chân trời H (Tiếp điểm)</text>

  <!-- Nhãn khoảng cách MH -->
  <g transform="translate(390, 200)" filter="url(#shadow)">
    <rect x="-80" y="-15" width="160" height="30" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">
      MH ≈ 25,3 km
    </text>
  </g>

  <!-- Hộp giải thích toán học phía trên -->
  <g transform="translate(360, 40)" filter="url(#shadow)">
    <rect x="-260" y="-20" width="520" height="40" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
      Tầm nhìn chân trời: MH = √(OM² − OH²) = √((6400 + 0,05)² − 6400²) ≈ 25,3 km
    </text>
  </g>

  <text x="360" y="405" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Hình 16.2 — Mô phỏng đường chân trời: Tia nhìn từ mắt người là tiếp tuyến với mặt cầu Trái Đất
  </text>
</svg>
