<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="max-width: 400px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="390" height="230" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn ngoại tiếp tâm O(200, 120), R = 80 -->
  <circle cx="200" cy="120" r="80" fill="rgba(0, 80, 180, 0.05)" stroke="#0050b4" stroke-width="2" stroke-dasharray="5,4" />
  
  <!-- Hình chữ nhật ABCD: dài 8 (128px), rộng 6 (96px) -> nửa dài 64, nửa rộng 48 -->
  <!-- A(136, 72), B(264, 72), C(264, 168), D(136, 168) -->
  <polygon points="136,72 264,72 264,168 136,168" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />

  <!-- Hai đường chéo AC và BD -->
  <line x1="136" y1="72" x2="264" y2="168" stroke="#dc2626" stroke-width="2" />
  <line x1="264" y1="72" x2="136" y2="168" stroke="#0050b4" stroke-width="2" />

  <!-- Tâm O -->
  <circle cx="200" cy="120" r="4" fill="#dc2626" />
  <text x="205" y="115" font-size="14" font-weight="bold" fill="#dc2626">O</text>

  <!-- Đỉnh A, B, C, D -->
  <circle cx="136" cy="72" r="3.5" fill="#1e293b" />
  <text x="120" y="68" font-size="14" font-weight="bold" fill="#1e293b">A</text>

  <circle cx="264" cy="72" r="3.5" fill="#1e293b" />
  <text x="272" y="68" font-size="14" font-weight="bold" fill="#1e293b">B</text>

  <circle cx="264" cy="168" r="3.5" fill="#1e293b" />
  <text x="272" y="180" font-size="14" font-weight="bold" fill="#1e293b">C</text>

  <circle cx="136" cy="168" r="3.5" fill="#1e293b" />
  <text x="120" y="180" font-size="14" font-weight="bold" fill="#1e293b">D</text>

  <!-- Kích thước AB = 8 cm, BC = 6 cm -->
  <text x="200" y="62" font-size="13" font-weight="bold" fill="#009650" text-anchor="middle">AB = 8 cm</text>
  <text x="295" y="125" font-size="13" font-weight="bold" fill="#009650" text-anchor="start">BC = 6 cm</text>
  <text x="200" y="215" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Đường chéo AC = 10 cm ⇒ Bán kính R = OA = 5 cm</text>

</svg>