<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Kỹ thuật nhẩm nghiệm nhanh — Kiểm tra tổng hệ số</text>
  <!-- Case 1 -->
  <rect x="20" y="45" width="300" height="110" rx="10" fill="#dbeeff" stroke="#0054a6" stroke-width="2"/>
  <text x="170" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#0054a6">Trường hợp 1</text>
  <rect x="40" y="78" width="260" height="30" rx="6" fill="#0054a6"/>
  <text x="170" y="98" text-anchor="middle" font-size="13" fill="white" font-weight="bold">a + b + c = 0</text>
  <text x="170" y="125" text-anchor="middle" font-size="12" fill="#333">Nghiệm: x₁ = 1</text>
  <text x="170" y="145" text-anchor="middle" font-size="12" fill="#333">x₂ = c/a</text>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#888">Vì thay x=1 vào PT luôn đúng</text>
  <!-- Case 2 -->
  <rect x="360" y="45" width="300" height="110" rx="10" fill="#fde8ef" stroke="#c00" stroke-width="2"/>
  <text x="510" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#c00">Trường hợp 2</text>
  <rect x="380" y="78" width="260" height="30" rx="6" fill="#c00"/>
  <text x="510" y="98" text-anchor="middle" font-size="13" fill="white" font-weight="bold">a − b + c = 0</text>
  <text x="510" y="125" text-anchor="middle" font-size="12" fill="#333">Nghiệm: x₁ = −1</text>
  <text x="510" y="145" text-anchor="middle" font-size="12" fill="#333">x₂ = −c/a</text>
  <text x="510" y="168" text-anchor="middle" font-size="11" fill="#888">Vì thay x=−1 vào PT luôn đúng</text>
  <!-- Examples -->
  <rect x="20" y="175" width="300" height="100" rx="8" fill="#f0fff4" stroke="#009060" stroke-width="1.5"/>
  <text x="170" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#009060">Ví dụ 1: 3x² − 8x + 5 = 0</text>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#333">a+b+c = 3−8+5 = 0 ✓</text>
  <text x="170" y="238" text-anchor="middle" font-size="12" fill="#333">x₁ = 1 ; x₂ = 5/3</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" fill="#666">S = {1 ; 5/3}</text>
  <rect x="360" y="175" width="300" height="100" rx="8" fill="#fff0f0" stroke="#c00" stroke-width="1.5"/>
  <text x="510" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#c00">Ví dụ 2: 4x² + 15x + 11 = 0</text>
  <text x="510" y="218" text-anchor="middle" font-size="12" fill="#333">a−b+c = 4−15+11 = 0 ✓</text>
  <text x="510" y="238" text-anchor="middle" font-size="12" fill="#333">x₁ = −1 ; x₂ = −11/4</text>
  <text x="510" y="258" text-anchor="middle" font-size="11" fill="#666">S = {−1 ; −11/4}</text>
</svg>
