<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -40 400 300" width="100%" height="100%" style="max-width: 400px; max-height: 300px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="-80" y1="-120" x2="-80" y2="80" /><line x1="-40" y1="-120" x2="-40" y2="80" /><line x1="0" y1="-120" x2="0" y2="80" /><line x1="40" y1="-120" x2="40" y2="80" /><line x1="80" y1="-120" x2="80" y2="80" /><line x1="120" y1="-120" x2="120" y2="80" /><line x1="160" y1="-120" x2="160" y2="80" /><line x1="200" y1="-120" x2="200" y2="80" /><line x1="240" y1="-120" x2="240" y2="80" />
    <line x1="-80" y1="80" x2="240" y2="80" /><line x1="-80" y1="40" x2="240" y2="40" /><line x1="-80" y1="0" x2="240" y2="0" /><line x1="-80" y1="-40" x2="240" y2="-40" /><line x1="-80" y1="-80" x2="240" y2="-80" /><line x1="-80" y1="-120" x2="240" y2="-120" />
  </g>
  <!-- Axes -->
  <g stroke="#000" stroke-width="2">
    <line x1="-80" y1="0" x2="240" y2="0" marker-end="url(#arrow)" /> <!-- x-axis -->
    <line x1="0" y1="80" x2="0" y2="-120" marker-end="url(#arrow)" /> <!-- y-axis -->
  </g>
  <!-- Ticks -->
  <g fill="#000" font-size="14" text-anchor="middle">
    <text x="250" y="5">x</text>
    <text x="-15" y="-130">y</text>
    <text x="-15" y="15">O</text>
    
    <text x="-40" y="20">-1</text>
    <text x="40" y="20">1</text>
    <text x="80" y="20">2</text>
    <text x="120" y="20">3</text>
    <text x="160" y="20">4</text>
    <text x="200" y="20">5</text>
    
    <text x="-20" y="-35">1</text>
    <text x="-20" y="-75">2</text>
    <text x="-20" y="45">-1</text>
  </g>
  <!-- Line y = -0.5x + 1.5 -->
  <!-- at x=-1.5 (-60), y=2.25 (-90) -->
  <!-- at x=4.5 (180), y=-0.75 (30) -->
  <line x1="-60" y1="-90" x2="180" y2="30" stroke="#0054a6" stroke-width="3" />
  <text x="190" y="20" fill="#0054a6" font-size="16" font-weight="bold">d</text>
  
  <!-- Points -->
  <circle cx="-40" cy="-80" r="4" fill="#000" />
  <text x="-40" y="-90" font-size="14" font-style="italic">N</text>
  <circle cx="120" cy="0" r="4" fill="#000" />
  <text x="125" y="-10" font-size="14" font-style="italic">B</text>
  
  <!-- Dashed lines -->
  <polyline points="-40,0 -40,-80 0,-80" fill="none" stroke="#000" stroke-dasharray="5,5" />

</svg>