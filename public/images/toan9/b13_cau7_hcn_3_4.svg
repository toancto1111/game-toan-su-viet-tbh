<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%" style="max-width: 320px; max-height: 250px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
  </defs>
  
  <circle cx="160" cy="125" r="75" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" />
  <!-- Rect width 120 (3cm), height 90 (4cm). Center (160, 125) -->
  <rect x="100" y="80" width="120" height="90" fill="rgba(37, 99, 235, 0.05)" stroke="#0f172a" stroke-width="2" />
  <line x1="100" y1="170" x2="220" y2="80" stroke="#dc2626" stroke-width="2" />
  <circle cx="160" cy="125" r="4" fill="#dc2626" />
  <text x="168" y="120" font-size="13" font-weight="bold" fill="#dc2626">O</text>

  <text x="85" y="178" font-size="13" font-weight="bold" fill="#0f172a">Q</text>
  <text x="226" y="178" font-size="13" font-weight="bold" fill="#0f172a">P</text>
  <text x="226" y="75" font-size="13" font-weight="bold" fill="#0f172a">N</text>
  <text x="85" y="75" font-size="13" font-weight="bold" fill="#0f172a">M</text>

  <text x="160" y="225" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">MP = √(3² + 4²) = 5 ⇒ R = 2,5 cm</text>

</svg>