<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="max-width: 600px; max-height: 360px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="590" height="350" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="300" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">ỨNG DỤNG THỰC TẾ: CỔNG VÒM PARABOL &amp; XE TẢI</text>

  <!-- Bối cảnh trời và đất -->
  <!-- Cổng vòm từ x=40 đến x=340, tâm x=190, mặt đất tại y=260 -->
  <!-- Độ rộng AB = 6m ~ 240px (40px/m) -> nửa nhịp 120px (3m) -->
  <!-- Chiều cao OH = 4.5m ~ 180px -> đỉnh tại y=80 -->

  <!-- Mặt đất -->
  <rect x="25" y="260" width="330" height="40" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
  <line x1="25" y1="260" x2="355" y2="260" stroke="#334155" stroke-width="3" />

  <!-- Khối tường cổng vòm Parabol -->
  <!-- Điểm bắt đầu (70, 260), đỉnh (190, 80), kết thúc (310, 260) -->
  <path d="M 50 260 L 50 60 L 330 60 L 330 260 L 310 260 Q 190 70 70 260 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <!-- Viền vòm cổng -->
  <path d="M 70 260 Q 190 70 310 260" fill="none" stroke="#d97706" stroke-width="6" />

  <!-- Đỉnh cổng O(190, 80) -->
  <circle cx="190" cy="80" r="4" fill="#dc2626" />
  <text x="185" y="70" font-size="13" font-weight="bold" fill="#dc2626">O (Đỉnh vòm)</text>

  <!-- Trục đối xứng nét đứt từ O xuống H(190, 260) -->
  <line x1="190" y1="80" x2="190" y2="260" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="190" cy="260" r="3.5" fill="#0f172a" />
  <text x="195" y="275" font-size="12" font-weight="bold" fill="#0f172a">H</text>

  <!-- Kích thước chiều cao OH = 4.5m -->
  <line x1="170" y1="80" x2="170" y2="260" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="115" y="175" font-size="12" font-weight="bold" fill="#dc2626">OH = 4,5 m</text>

  <!-- Chiều rộng chân cổng AB = 6m -->
  <circle cx="70" cy="260" r="4" fill="#059669" />
  <text x="55" y="280" font-size="13" font-weight="bold" fill="#059669">A</text>
  <circle cx="310" cy="260" r="4" fill="#059669" />
  <text x="315" y="280" font-size="13" font-weight="bold" fill="#059669">B</text>

  <line x1="70" y1="285" x2="310" y2="285" stroke="#059669" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)" />
  <text x="190" y="302" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">AB = 6 m (Mỗi bên 3 m)</text>

  <!-- Hình ảnh xe tải:
       Chiều rộng 2m ~ 80px (từ x=150 đến x=230)
       Chiều cao 3m ~ 120px (từ y=260 lên y=140)
  -->
  <rect x="150" y="140" width="80" height="120" fill="#0284c7" stroke="#0369a1" stroke-width="2.5" rx="4" />
  <!-- Kính cabin xe -->
  <rect x="158" y="148" width="64" height="40" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <!-- Đèn xe -->
  <circle cx="162" cy="240" r="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
  <circle cx="218" cy="240" r="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
  <!-- Biển số -->
  <rect x="175" y="234" width="30" height="12" fill="#ffffff" stroke="#334155" stroke-width="1" />
  <text x="190" y="243" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">29C-1234</text>

  <!-- Kích thước xe tải: rộng 2m, cao 3m -->
  <line x1="150" y1="130" x2="230" y2="130" stroke="#0284c7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="190" y="123" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">Rộng 2 m</text>

  <!-- Điểm mép vòm tại mép xe x=230 (x=1m tính từ tâm O) -->
  <!-- y = 4.5 - 0.5*(1)^2 = 4.0m -> y_px = 80 + 0.5*40 = 100px -->
  <circle cx="230" cy="100" r="4" fill="#ea580c" />
  <line x1="230" y1="100" x2="230" y2="140" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,3" />
  <text x="238" y="122" font-size="11" font-weight="bold" fill="#ea580c">Dư 1 m</text>

  <!-- Khung giải thuật bên phải -->
  <g transform="translate(370, 48)">
    <rect x="0" y="0" width="210" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#ea580c" />
    <text x="105" y="22" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LỜI GIẢI TOÁN HỌC</text>

    <text x="12" y="58" font-size="11.5" font-weight="bold" fill="#0f172a">1. Lập phương trình vòm:</text>
    <text x="16" y="78" font-size="11" fill="#334155">• Gốc O tại đỉnh vòm</text>
    <text x="16" y="96" font-size="11" fill="#334155">• Chân cổng B(3; -4,5)</text>
    <text x="16" y="116" font-size="11" fill="#334155">• -4,5 = a·3² ⇒ a = -0,5</text>
    <text x="16" y="136" font-size="12" font-weight="bold" fill="#0284c7">⇒ y = -0,5x²</text>

    <line x1="12" y1="148" x2="198" y2="148" stroke="#e2e8f0" stroke-width="1" />

    <text x="12" y="168" font-size="11.5" font-weight="bold" fill="#0f172a">2. Kiểm tra mép xe tải:</text>
    <text x="16" y="188" font-size="11" fill="#334155">• Xe rộng 2m ⇒ mép tại x = 1</text>
    <text x="16" y="206" font-size="11" fill="#334155">• y = -0,5·(1)² = -0,5 m</text>
    <text x="16" y="226" font-size="11" fill="#334155">• Độ cao thông thủy:</text>
    <text x="24" y="244" font-size="12" font-weight="bold" fill="#16a34a">h = 4,5 - 0,5 = 4 m &gt; 3 m</text>

    <text x="12" y="268" font-size="12" font-weight="bold" fill="#16a34a">✓ Xe tải đi qua an toàn!</text>
  </g>

</svg>