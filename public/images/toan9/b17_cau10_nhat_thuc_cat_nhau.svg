<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="corona" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Nền vũ trụ đêm sâu -->
  <rect width="520" height="360" rx="14" fill="#090d16"/>

  <!-- Một vài vì sao nền -->
  <circle cx="60" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="90" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="450" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="480" cy="140" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="70" cy="300" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="460" cy="290" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- Tọa độ chuẩn hình học:
       Tỉ lệ: 1 độ = 200px
       R (Mặt Trời) = 0.53 * 200 = 106px
       r (Mặt Trăng) = 0.51 * 200 = 102px
       d = 0.2 * 200 = 40px
       Tâm Mặt Trời S tại (240, 170)
       Tâm Mặt Trăng M tại (240 + 40, 170) = (280, 170)
  -->

  <!-- Hào quang Mặt Trời (Corona) -->
  <circle cx="240" cy="170" r="125" fill="#f59e0b" fill-opacity="0.3" filter="url(#corona)"/>

  <!-- Đĩa Mặt Trời (Sun): Tâm S(240, 170), R = 106 -->
  <circle cx="240" cy="170" r="106" fill="url(#sunGrad)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Đĩa Mặt Trăng (Moon): Tâm M(280, 170), r = 102 (Đĩa tối che khuất) -->
  <circle cx="280" cy="170" r="102" fill="url(#moonGrad)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Vành sáng lưỡi liềm bên trái lộ ra của Mặt Trời -->
  <!-- 2 giao điểm cắt nhau giữa 2 đường tròn -->
  <!-- d = 40. x_intersect tính từ S: x = (106^2 - 102^2 + 40^2)/(2*40) = (11236 - 10404 + 1600)/80 = 2432/80 = 30.4px
       y_intersect = sqrt(106^2 - 30.4^2) = sqrt(11236 - 924.16) = sqrt(10311.84) ~ 101.5px
       Giao điểm 1: (240 + 30.4, 170 - 101.5) = (270.4, 68.5)
       Giao điểm 2: (240 + 30.4, 170 + 101.5) = (270.4, 271.5)
  -->
  <circle cx="270.4" cy="68.5" r="4.5" fill="#ef4444"/>
  <circle cx="270.4" cy="271.5" r="4.5" fill="#ef4444"/>
  <text x="282" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Giao điểm 1</text>
  <text x="282" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Giao điểm 2</text>

  <!-- Đoạn nối tâm SM (40px) -->
  <line x1="240" y1="170" x2="280" y2="170" stroke="#facc15" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="240" cy="170" r="3.5" fill="#facc15"/>
  <text x="228" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#facc15">S</text>

  <circle cx="280" cy="170" r="3.5" fill="#94a3b8"/>
  <text x="285" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">M</text>

  <text x="260" y="188" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">d = 0,2°</text>

  <!-- Nhãn Mặt Trời và Mặt Trăng -->
  <text x="175" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Mặt Trời</text>
  <text x="175" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fef08a">R = 0,53°</text>

  <text x="330" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">Mặt Trăng</text>
  <text x="330" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">r = 0,51°</text>

  <!-- Hộp kết luận phía dưới -->
  <g transform="translate(260, 325)">
    <rect x="-210" y="-14" width="420" height="28" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">
      R − r = 0,02° &lt; d = 0,2° &lt; R + r = 1,04° ⟹ Hai đường tròn CẮT NHAU
    </text>
  </g>
</svg>
