<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%" style="max-width: 460px; max-height: 260px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="450" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- Mặt đất -->
  <line x1="20" y1="210" x2="440" y2="210" stroke="#64748b" stroke-width="2" />
  
  <!-- Cái cây bên phải x=360: Thân cây từ y=210 lên y=90, Tán lá từ y=90 lên y=30 -->
  <rect x="355" y="100" width="14" height="110" fill="#78350f" />
  <!-- Tán lá cây -->
  <polygon points="362,30 330,110 394,110" fill="#15803d" />
  <polygon points="362,60 320,130 404,130" fill="#16a34a" />
  
  <!-- Người quan sát bên trái B(80, 210) -->
  <circle cx="80" cy="165" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
  <line x1="80" y1="172" x2="80" y2="210" stroke="#1e293b" stroke-width="3" />
  <text x="65" y="195" font-size="12" font-weight="bold" fill="#16a34a">1,5 m</text>

  <!-- Mắt người M(80, 165), Chiếu lên cây H(362, 165), Đỉnh cây C(362, 30) -->
  <line x1="80" y1="165" x2="362" y2="165" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="80" y1="165" x2="362" y2="30" stroke="#0050b4" stroke-width="2.5" />
  
  <!-- Góc nâng 40 độ tại M -->
  <path d="M 130 165 A 50 50 0 0 0 120 142" fill="none" stroke="#ea580c" stroke-width="2" />
  <text x="135" y="152" font-size="13" font-weight="bold" fill="#ea580c">40°</text>

  <!-- Khoảng cách 10m -->
  <text x="220" y="180" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Khoảng cách = 10 m</text>

  <!-- Nhãn chiều cao ngọn cây h' và tổng chiều cao h -->
  <text x="385" y="95" font-size="12" font-weight="bold" fill="#dc2626">h' ≈ 8,4 m</text>
  <text x="385" y="190" font-size="12" font-weight="bold" fill="#16a34a">1,5 m</text>
  <text x="220" y="235" font-size="13" font-weight="bold" fill="#0050b4" text-anchor="middle">Tổng chiều cao cây = 8,39 + 1,5 ≈ 9,9 m</text>

</svg>