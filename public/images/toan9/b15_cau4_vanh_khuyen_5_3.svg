<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="14" fill="#f8fafc"/>

  <!-- Tâm O(200, 150), R = 100 (5cm), r = 60 (3cm) -->
  <path d="M 200 50 A 100 100 0 1 0 200 250 A 100 100 0 1 0 200 50 Z M 200 90 A 60 60 0 1 1 200 210 A 60 60 0 1 1 200 90 Z" 
        fill="url(#ringGrad)" fill-rule="evenodd" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>

  <!-- Lỗ tròn tâm trắng -->
  <circle cx="200" cy="150" r="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Bán kính trong r = 3cm -->
  <line x1="200" y1="150" x2="252" y2="120" stroke="#0369a1" stroke-width="2.5"/>
  <circle cx="252" cy="120" r="3" fill="#0369a1"/>
  <text x="228" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">r = 3</text>

  <!-- Bán kính ngoài R = 5cm -->
  <line x1="200" y1="150" x2="113.4" y2="200" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="113.4" cy="200" r="3" fill="#dc2626"/>
  <text x="145" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">R = 5</text>

  <!-- Tâm O -->
  <circle cx="200" cy="150" r="4" fill="#0f172a"/>
  <text x="200" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>

  <!-- Diện tích Sv -->
  <text x="200" y="78" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">
    S<tspan font-size="11" dy="3">v</tspan><tspan font-size="16" dy="-3"> = 16π cm²</tspan>
  </text>

  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
    Hình vành khuyên R = 5 cm, r = 3 cm
  </text>
</svg>
