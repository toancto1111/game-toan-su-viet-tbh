<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="440" height="320" rx="14" fill="#f8fafc"/>

  <!-- Tâm O tại (150, 160), R = 80 (đại diện cho 8cm) -->
  <circle cx="150" cy="160" r="80" fill="#eff6ff" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Tiếp điểm A tại (230, 160) (mép phải) -->
  <!-- Tiếp tuyến Delta thẳng đứng qua A (230, 160) -->
  <line x1="230" y1="30" x2="230" y2="290" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="240" y="45" font-family="system-ui, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#ea580c">Δ</text>

  <!-- Điểm B trên Delta: B(230, 160 - 60) = (230, 100) (đại diện 6cm) -->
  <line x1="150" y1="160" x2="230" y2="100" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="180" y="120" font-family="system-ui, sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#9333ea">OB = 10</text>

  <!-- Bán kính OA -->
  <line x1="150" y1="160" x2="230" y2="160" stroke="#0284c7" stroke-width="2.5"/>
  <text x="180" y="180" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#0284c7">OA = 8</text>

  <!-- Đoạn AB = 6 -->
  <line x1="230" y1="160" x2="230" y2="100" stroke="#dc2626" stroke-width="3.5"/>
  <text x="245" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">AB = 6</text>

  <!-- Góc vuông tại A -->
  <rect x="215" y="145" width="15" height="15" fill="none" stroke="#ea580c" stroke-width="2"/>

  <!-- Các điểm -->
  <circle cx="150" cy="160" r="4.5" fill="#0284c7"/>
  <text x="135" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

  <circle cx="230" cy="160" r="4.5" fill="#ea580c"/>
  <text x="245" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">A</text>

  <circle cx="230" cy="100" r="4.5" fill="#9333ea"/>
  <text x="245" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#9333ea">B</text>

  <!-- Hộp tính toán -->
  <g transform="translate(220, 260)" filter="url(#shadow)">
    <rect x="-130" y="-14" width="260" height="28" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
      OB = √(8² + 6²) = √100 = 10 cm
    </text>
  </g>
</svg>
