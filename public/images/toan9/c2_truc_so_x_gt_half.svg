<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%" style="max-width: 400px; max-height: 130px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <line x1="30" y1="65" x2="370" y2="65" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-black)" />
  <text x="380" y="70" font-size="16" font-style="italic" font-weight="bold" fill="#1e293b">x</text>

  <!-- Mốc 0 -->
  <line x1="120" y1="57" x2="120" y2="73" stroke="#1e293b" stroke-width="2" />
  <text x="120" y="95" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <!-- Mốc 1/2 -->
  <line x1="190" y1="65" x2="360" y2="65" stroke="#dc2626" stroke-width="4.5" />

  <!-- Dấu ngoặc tròn '(' tại 1/2 hướng về bên phải -->
  <path d="M 194 50 Q 186 65 194 80" fill="none" stroke="#dc2626" stroke-width="3" />
  <text x="190" y="102" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">1/2</text>

  <!-- Vùng gạch bỏ x <= 1/2 -->
  <rect x="35" y="55" width="152" height="20" fill="url(#hatch-blue)" />
  
  <text x="280" y="32" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Tập nghiệm: x > 1/2</text>
  <text x="100" y="32" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">(Phần bị gạch bỏ)</text>

</svg>