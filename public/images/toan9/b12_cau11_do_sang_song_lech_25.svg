<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%" style="max-width: 440px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="430" height="230" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
  <!-- Bờ sông 1 (trên) -->
  <rect x="5" y="20" width="430" height="25" fill="#86efac" />
  <line x1="5" y1="45" x2="435" y2="45" stroke="#16a34a" stroke-width="2" />
  <text x="40" y="37" font-size="12" font-weight="bold" fill="#14532d">Bờ bên kia</text>

  <!-- Bờ sông 2 (dưới) -->
  <rect x="5" y="195" width="430" height="25" fill="#86efac" />
  <line x1="5" y1="195" x2="435" y2="195" stroke="#16a34a" stroke-width="2" />
  <text x="40" y="212" font-size="12" font-weight="bold" fill="#14532d">Bờ xuất phát</text>

  <!-- Điểm xuất phát A(120, 195) -->
  <!-- Hướng vuông góc thẳng qua bờ B(120, 45) -->
  <line x1="120" y1="195" x2="120" y2="45" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />
  <polyline points="120,60 135,60 135,45" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="105" y="120" font-size="13" font-weight="bold" fill="#dc2626">d = ? (rộng sông)</text>

  <!-- Hướng đò thực tế bị nước đẩy lệch 25 độ đến C(220, 45) -->
  <line x1="120" y1="195" x2="220" y2="45" stroke="#0050b4" stroke-width="3" marker-end="url(#arrow)" />
  
  <!-- Góc lệch 25 độ tại A -->
  <path d="M 120 145 A 50 50 0 0 1 138 152" fill="none" stroke="#ea580c" stroke-width="2" />
  <text x="135" y="135" font-size="13" font-weight="bold" fill="#ea580c">25°</text>

  <!-- Thuyền ở giữa dòng -->
  <g transform="translate(170, 120) rotate(-34)">
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="#b45309" />
  </g>

  <!-- Độ dài thực tế 150m -->
  <text x="195" y="120" font-size="13" font-weight="bold" fill="#0050b4" transform="rotate(-56 195 120)">Đường đò = 150 m</text>
  <text x="280" y="215" font-size="12" font-weight="bold" fill="#0369a1">Chiều rộng d = 150 · cos 25° ≈ 136 m</text>

</svg>