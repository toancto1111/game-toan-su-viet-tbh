<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="520" height="360" rx="14" fill="#url(#bgGrad)"/>

  <!-- Tam giác ABC vuông tại A -->
  <!-- Đặt BC nằm ngang ở đáy y = 250: B(80, 250), C(440, 250), độ dài 360px (đại diện 5cm) -->
  <!-- AH = 2.4/5 * 360 = 172.8px. BH = 1.8/5 * 360 = 129.6px => H = (80 + 129.6, 250) = (209.6, 250) -->
  <!-- A = (209.6, 250 - 172.8) = (209.6, 77.2) -->

  <!-- Đường tròn (A; AH) tâm A(209.6, 77.2), R = 172.8 -->
  <circle cx="209.6" cy="77.2" r="172.8" fill="#fef3c7" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Tam giác ABC tô nền -->
  <polygon points="209.6,77.2 80,250 440,250" fill="#eff6ff" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Đường thẳng kéo dài của BC (tiếp tuyến) -->
  <line x1="30" y1="250" x2="490" y2="250" stroke="#ea580c" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="495" y="255" font-family="system-ui, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#ea580c">BC</text>

  <!-- Đường cao AH (bán kính R) -->
  <line x1="209.6" y1="77.2" x2="209.6" y2="250" stroke="#dc2626" stroke-width="2.5"/>
  <text x="220" y="170" font-family="system-ui, sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#dc2626">R = AH</text>

  <!-- Ký hiệu góc vuông tại H -->
  <rect x="209.6" y="235" width="15" height="15" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Ký hiệu góc vuông tại A (góc BAC) -->
  <!-- AB vector: (-129.6, 172.8), AC vector: (230.4, 172.8) -->
  <path d="M 197.6 93.2 L 213.6 105.2 L 225.6 89.2" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Điểm A, B, C, H -->
  <circle cx="209.6" cy="77.2" r="4.5" fill="#dc2626"/>
  <text x="209.6" y="60" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">A (Tâm)</text>

  <circle cx="80" cy="250" r="4.5" fill="#0284c7"/>
  <text x="65" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">B</text>

  <circle cx="440" cy="250" r="4.5" fill="#0284c7"/>
  <text x="450" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">C</text>

  <circle cx="209.6" cy="250" r="4.5" fill="#ea580c"/>
  <text x="209.6" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c" text-anchor="middle">H (Tiếp điểm)</text>

  <!-- Kích thước cạnh -->
  <text x="125" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">AB = 3</text>
  <text x="340" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">AC = 4</text>
  <text x="310" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">BC = 5</text>

  <!-- Hộp kết luận -->
  <g transform="translate(260, 310)" filter="url(#shadow)">
    <rect x="-180" y="-14" width="360" height="28" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">
      H ∈ (A; AH) và BC ⊥ AH tại H ⟹ BC là tiếp tuyến của (A; AH)
    </text>
  </g>
</svg>
