<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" height="100%" style="max-width: 560px; max-height: 330px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="550" height="320" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="280" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">RÒNG RỌC KÉP: TIẾP XÚC NGOÀI &amp; TIẾP TUYẾN CHUNG</text>

  <!-- Đường tròn (O; R=80px ~ 4cm) tâm O(130, 180) -->
  <circle cx="130" cy="180" r="80" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2.5" />

  <!-- Đường tròn (O'; r=60px ~ 3cm) tâm O'(270, 180) -->
  <!-- OO' = 140px ~ 7cm -->
  <circle cx="270" cy="180" r="60" fill="rgba(16, 185, 129, 0.08)" stroke="#059669" stroke-width="2.5" />

  <!-- Đoạn nối tâm OO' -->
  <line x1="130" y1="180" x2="270" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />
  <text x="195" y="198" font-size="12" font-weight="bold" fill="#64748b">OO' = 7 cm</text>

  <!-- Tiếp điểm A(210, 180) giữa 2 đường tròn -->
  <circle cx="210" cy="180" r="4.5" fill="#ea580c" />
  <text x="208" y="172" font-size="14" font-weight="bold" fill="#ea580c">A</text>

  <!-- Tiếp tuyến chung ngoài BC:
       B ~ (118.5, 100.8), C ~ (261.4, 120.6)
  -->
  <line x1="80" y1="95.3" x2="310" y2="127.3" stroke="#dc2626" stroke-width="2.5" />
  <text x="175" y="95" font-size="13" font-weight="bold" fill="#dc2626">BC = 4√3 cm</text>

  <!-- Tiếp tuyến chung trong tại A vuông góc OO' cắt BC tại M(210, 113.4) -->
  <line x1="210" y1="180" x2="210" y2="85" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="210" cy="113.4" r="4" fill="#8b5cf6" />
  <text x="215" y="112" font-size="13" font-weight="bold" fill="#8b5cf6">M</text>

  <!-- Dây AB và AC nối từ A đến 2 tiếp điểm B, C -->
  <line x1="210" y1="180" x2="118.5" y2="100.8" stroke="#0284c7" stroke-width="2" />
  <line x1="210" y1="180" x2="261.4" y2="120.6" stroke="#059669" stroke-width="2" />

  <!-- Bán kính OB và O'C vuông góc BC -->
  <line x1="130" y1="180" x2="118.5" y2="100.8" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3" />
  <text x="110" y="150" font-size="12" font-weight="bold" fill="#0284c7">R=4</text>

  <line x1="270" y1="180" x2="261.4" y2="120.6" stroke="#059669" stroke-width="2" stroke-dasharray="3,3" />
  <text x="272" y="155" font-size="12" font-weight="bold" fill="#059669">r=3</text>

  <!-- Ký hiệu góc vuông BAC = 90 độ tại A -->
  <path d="M 197 169 L 204 161 L 217 172" fill="none" stroke="#ea580c" stroke-width="2" />
  <text x="180" y="160" font-size="11" font-weight="bold" fill="#ea580c">90°</text>

  <!-- Tiếp điểm B và C -->
  <circle cx="118.5" cy="100.8" r="4.5" fill="#dc2626" />
  <text x="105" y="98" font-size="14" font-weight="bold" fill="#dc2626">B</text>

  <circle cx="261.4" cy="120.6" r="4.5" fill="#dc2626" />
  <text x="270" y="118" font-size="14" font-weight="bold" fill="#dc2626">C</text>

  <!-- Tâm O và O' -->
  <circle cx="130" cy="180" r="4.5" fill="#0284c7" />
  <text x="115" y="195" font-size="14" font-weight="bold" fill="#0284c7">O</text>
  <circle cx="270" cy="180" r="4.5" fill="#059669" />
  <text x="278" y="195" font-size="14" font-weight="bold" fill="#059669">O'</text>

  <!-- Khung tổng kết bên phải -->
  <g transform="translate(345, 45)">
    <rect x="0" y="0" width="195" height="255" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#0284c7" />
    <text x="97" y="21" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ĐẶC ĐIỂM HÌNH HỌC</text>

    <text x="12" y="55" font-size="11.5" font-weight="bold" fill="#0f172a">• Đoạn nối tâm:</text>
    <text x="16" y="73" font-size="11" fill="#334155">OO' = R + r = 4 + 3 = 7 cm</text>

    <text x="12" y="98" font-size="11.5" font-weight="bold" fill="#0f172a">• Tứ giác OBCO':</text>
    <text x="16" y="116" font-size="11" fill="#334155">OB // O'C (cùng ⊥ BC)</text>
    <text x="16" y="134" font-size="11" font-weight="bold" fill="#0284c7">⇒ Là hình thang vuông</text>

    <text x="12" y="158" font-size="11.5" font-weight="bold" fill="#0f172a">• Tiếp tuyến chung BC:</text>
    <text x="16" y="176" font-size="11" fill="#334155">BC = √(7² - (4-3)²)</text>
    <text x="16" y="194" font-size="11.5" font-weight="bold" fill="#dc2626">= √48 = 4√3 cm</text>

    <text x="12" y="218" font-size="11.5" font-weight="bold" fill="#0f172a">• Góc BAC vuông:</text>
    <text x="16" y="236" font-size="11" fill="#334155">MA = MB = MC = BC/2</text>
    <text x="16" y="250" font-size="11" font-weight="bold" fill="#ea580c">⇒ ΔBAC vuông tại A (90°)</text>
  </g>

</svg>