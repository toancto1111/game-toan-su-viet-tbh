<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="14" fill="#f8fafc"/>

  <!-- Mặt đồng hồ: Tâm O(190, 160), R = 100 -->
  <circle cx="190" cy="160" r="100" fill="#ffffff" stroke="#0284c7" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="190" cy="160" r="94" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Các vạch số trên đồng hồ -->
  <!-- 12h -->
  <text x="190" y="85" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">12</text>
  <!-- 3h -->
  <text x="268" y="166" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">3</text>
  <!-- 6h -->
  <text x="190" y="245" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#64748b" text-anchor="middle">6</text>
  <!-- 9h -->
  <text x="112" y="166" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#64748b" text-anchor="middle">9</text>

  <!-- Vùng quét 15 phút (90 độ) tô màu đỏ nhạt -->
  <path d="M 190 160 L 190 70 A 90 90 0 0 1 280 160 Z" fill="#fee2e2" fill-opacity="0.7"/>

  <!-- Cung đường đi màu đỏ tươi -->
  <path d="M 190 70 A 90 90 0 0 1 280 160" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

  <!-- Kim phút vị trí ban đầu (12h) -->
  <line x1="190" y1="160" x2="190" y2="70" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="162" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">10 cm</text>

  <!-- Kim phút vị trí sau 15 phút (3h) -->
  <line x1="190" y1="160" x2="280" y2="160" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Góc vuông 90 độ tại tâm -->
  <rect x="190" y="145" width="15" height="15" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="197" cy="152" r="1.5" fill="#dc2626"/>

  <!-- Tâm O -->
  <circle cx="190" cy="160" r="5" fill="#0f172a"/>
  <text x="175" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

  <!-- Nhãn độ dài cung -->
  <g transform="translate(265, 100)" filter="url(#shadow)">
    <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">
      l = 5π cm
    </text>
  </g>

  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
    Kim phút quay 15 phút quét góc ở tâm 90°
  </text>
</svg>
