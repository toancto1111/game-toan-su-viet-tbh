<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <defs>
    <marker id="da" markerWidth="6" markerHeight="5" refX="3" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#666"/></marker>
  </defs>
  <text x="310" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Bài toán thực tế: Vườn rau thuỷ canh — Chu vi 40m, S = 96m²</text>
  <!-- Soil background -->
  <rect x="40" y="45" width="400" height="260" rx="6" fill="#c4a97a" opacity="0.3"/>
  <!-- Garden rectangle: 12×8 scaled to ~300×200 -->
  <rect x="80" y="80" width="320" height="200" rx="4" fill="#7ab874" opacity="0.7" stroke="#4a7c4a" stroke-width="2"/>
  <!-- Fence pattern -->
  <g stroke="#888" stroke-width="1.5" fill="none">
    <rect x="80" y="80" width="320" height="200" stroke="#607080" stroke-width="3" fill="none"/>
    <!-- Fence posts -->
    <line x1="80" y1="80" x2="80" y2="280" stroke="#5a6a7a" stroke-width="4"/>
    <line x1="400" y1="80" x2="400" y2="280" stroke="#5a6a7a" stroke-width="4"/>
    <line x1="80" y1="80" x2="400" y2="80" stroke="#5a6a7a" stroke-width="4"/>
    <line x1="80" y1="280" x2="400" y2="280" stroke="#5a6a7a" stroke-width="4"/>
  </g>
  <!-- Crop rows -->
  <g fill="#2d7a2d">
    <circle cx="120" cy="120" r="7"/><circle cx="160" cy="120" r="7"/><circle cx="200" cy="120" r="7"/>
    <circle cx="240" cy="120" r="7"/><circle cx="280" cy="120" r="7"/><circle cx="320" cy="120" r="7"/>
    <circle cx="360" cy="120" r="7"/>
    <circle cx="120" cy="160" r="7"/><circle cx="160" cy="160" r="7"/><circle cx="200" cy="160" r="7"/>
    <circle cx="240" cy="160" r="7"/><circle cx="280" cy="160" r="7"/><circle cx="320" cy="160" r="7"/>
    <circle cx="360" cy="160" r="7"/>
    <circle cx="120" cy="200" r="7"/><circle cx="160" cy="200" r="7"/><circle cx="200" cy="200" r="7"/>
    <circle cx="240" cy="200" r="7"/><circle cx="280" cy="200" r="7"/><circle cx="320" cy="200" r="7"/>
    <circle cx="360" cy="200" r="7"/>
    <circle cx="120" cy="240" r="7"/><circle cx="160" cy="240" r="7"/><circle cx="200" cy="240" r="7"/>
    <circle cx="240" cy="240" r="7"/><circle cx="280" cy="240" r="7"/><circle cx="320" cy="240" r="7"/>
    <circle cx="360" cy="240" r="7"/>
  </g>
  <!-- Labels inside garden -->
  <text x="240" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#003300">Diện tích = 96 m²</text>
  <!-- Dimension arrows -->
  <line x1="80" y1="310" x2="400" y2="310" stroke="#c00" stroke-width="1.5" marker-start="url(#da)" marker-end="url(#da)"/>
  <text x="240" y="328" text-anchor="middle" font-size="13" fill="#c00" font-weight="bold">Chiều dài x = 12 m</text>
  <line x1="440" y1="80" x2="440" y2="280" stroke="#c00" stroke-width="1.5" marker-start="url(#da)" marker-end="url(#da)"/>
  <text x="530" y="185" text-anchor="middle" font-size="13" fill="#c00" font-weight="bold" transform="rotate(90,530,185)">Chiều rộng y = 8 m</text>
  <!-- Solution box -->
  <rect x="460" y="80" width="145" height="200" rx="8" fill="#f0fff4" stroke="#009060" stroke-width="1.5"/>
  <text x="532" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#003300">Viète đảo:</text>
  <text x="532" y="124" text-anchor="middle" font-size="11" fill="#222">x + y = 20</text>
  <text x="532" y="144" text-anchor="middle" font-size="11" fill="#222">xy = 96</text>
  <line x1="470" y1="158" x2="596" y2="158" stroke="#ddd"/>
  <text x="532" y="178" text-anchor="middle" font-size="11" fill="#222">X²−20X+96=0</text>
  <text x="532" y="198" text-anchor="middle" font-size="11" fill="#222">Δ′=100−96=4</text>
  <text x="532" y="218" text-anchor="middle" font-size="11" fill="#222">X=10±2</text>
  <line x1="470" y1="232" x2="596" y2="232" stroke="#009060"/>
  <text x="532" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#003300">x=12, y=8</text>
  <!-- Fence length label -->
  <text x="240" y="350" text-anchor="middle" font-size="12" fill="#444">Chu vi lưới = 40 m → Nửa chu vi S = x+y = 20</text>
</svg>
