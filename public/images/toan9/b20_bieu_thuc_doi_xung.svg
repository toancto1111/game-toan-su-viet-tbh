<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Các công thức tính biểu thức đối xứng theo S và P</text>
  <!-- Table header -->
  <rect x="20" y="45" width="640" height="40" rx="5" fill="#0054a6"/>
  <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Biểu thức</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Biến đổi theo S và P</text>
  <!-- Row 1 -->
  <rect x="20" y="85" width="640" height="45" rx="2" fill="#e3f2fd"/>
  <text x="200" y="112" text-anchor="middle" font-size="13" fill="#333">x₁² + x₂²</text>
  <text x="450" y="112" text-anchor="middle" font-size="13" fill="#0054a6">= (x₁+x₂)² − 2x₁x₂ = S² − 2P</text>
  <!-- Row 2 -->
  <rect x="20" y="130" width="640" height="45" rx="2" fill="#fff3e0"/>
  <text x="200" y="157" text-anchor="middle" font-size="13" fill="#333">(x₁ − x₂)²</text>
  <text x="450" y="157" text-anchor="middle" font-size="13" fill="#cc6600">= (x₁+x₂)² − 4x₁x₂ = S² − 4P = Δ/a²</text>
  <!-- Row 3 -->
  <rect x="20" y="175" width="640" height="45" rx="2" fill="#e8f5e9"/>
  <text x="200" y="202" text-anchor="middle" font-size="13" fill="#333">1/x₁ + 1/x₂</text>
  <text x="450" y="202" text-anchor="middle" font-size="13" fill="#009060">= (x₁+x₂)/(x₁x₂) = S/P</text>
  <!-- Row 4 -->
  <rect x="20" y="220" width="640" height="45" rx="2" fill="#fce4ec"/>
  <text x="200" y="247" text-anchor="middle" font-size="13" fill="#333">x₁³ + x₂³</text>
  <text x="450" y="247" text-anchor="middle" font-size="13" fill="#c00">= (x₁+x₂)³ − 3x₁x₂(x₁+x₂) = S³ − 3PS</text>
  <!-- Dividers -->
  <line x1="340" y1="45" x2="340" y2="265" stroke="#aaa" stroke-width="1"/>
  <line x1="20" y1="85" x2="660" y2="85" stroke="#666" stroke-width="1"/>
  <!-- Example box -->
  <rect x="20" y="275" width="640" height="40" rx="6" fill="#e8f5e9" stroke="#009060" stroke-width="1.5"/>
  <text x="340" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#003300">Ví dụ: PT x² − 5x + 3 = 0 → S=5, P=3</text>
  <text x="340" y="309" text-anchor="middle" font-size="12" fill="#333">A = x₁²+x₂² = 25−6 = 19 ;   B = 1/x₁+1/x₂ = 5/3</text>
</svg>
