<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -140 240 300" width="100%" height="100%" style="max-width: 400px; max-height: 300px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>
  
  <!-- Axes -->
  <g stroke="#000" stroke-width="2">
    <line x1="-80" y1="0" x2="80" y2="0" marker-end="url(#arrow)" /> <!-- x-axis -->
    <line x1="0" y1="80" x2="0" y2="-120" marker-end="url(#arrow)" /> <!-- y-axis -->
  </g>
  <!-- Ticks -->
  <g fill="#000" font-size="14" text-anchor="middle">
    <text x="90" y="5">x</text>
    <text x="-15" y="-130">y</text>
    <text x="-15" y="15">O</text>
    
    <text x="-40" y="20">-1</text>
    <text x="40" y="20">1</text>
    
    <text x="-20" y="-35">1</text>
    <text x="-20" y="-75">2</text>
    <text x="-20" y="45">-1</text>
  </g>
  <!-- Line y = 3x + 2 -->
  <line x1="-48" y1="56" x2="12" y2="-128" stroke="#0054a6" stroke-width="3" />
  
  <!-- Points -->
  <circle cx="0" cy="-80" r="4" fill="#000" />
  <circle cx="-40" cy="40" r="4" fill="#000" />
  
  <!-- Dashed lines -->
  <polyline points="-40,0 -40,40 0,40" fill="none" stroke="#000" stroke-dasharray="5,5" />

</svg>