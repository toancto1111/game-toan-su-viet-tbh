<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="100%" height="100%" style="max-width: 420px; max-height: 250px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="410" height="240" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- Tường gạch bên trái x=60 đến 100 -->
  <rect x="60" y="20" width="40" height="180" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5" />
  <!-- Đất -->
  <rect x="20" y="200" width="380" height="35" fill="#e2e8f0" />
  <line x1="20" y1="200" x2="400" y2="200" stroke="#64748b" stroke-width="2" />

  <!-- Thang: Điểm tựa trên tường B(100, 35), Chân thang A(200, 200) -->
  <line x1="200" y1="200" x2="100" y2="35" stroke="#ea580c" stroke-width="5" />
  <line x1="195" y1="202" x2="95" y2="37" stroke="#9a3412" stroke-width="1.5" />
  <!-- Các bậc thang -->
  <line x1="185" y1="175" x2="175" y2="165" stroke="#9a3412" stroke-width="2" />
  <line x1="165" y1="142" x2="155" y2="132" stroke="#9a3412" stroke-width="2" />
  <line x1="145" y1="109" x2="135" y2="99" stroke="#9a3412" stroke-width="2" />
  <line x1="125" y1="76" x2="115" y2="66" stroke="#9a3412" stroke-width="2" />

  <!-- Góc vuông tại chân tường O(100, 200) -->
  <polyline points="100,185 115,185 115,200" fill="none" stroke="#475569" stroke-width="1.5" />

  <!-- Góc 70 độ tại chân thang -->
  <path d="M 165 200 A 35 35 0 0 1 178 168" fill="none" stroke="#0050b4" stroke-width="2.5" />
  <text x="155" y="180" font-size="13" font-weight="bold" fill="#0050b4">70°</text>

  <!-- Khoảng cách chân thang 1,5m -->
  <text x="150" y="218" font-size="13" font-weight="bold" fill="#009650" text-anchor="middle">1,5 m</text>
  
  <!-- Chiều dài thang L = ? -->
  <text x="165" y="105" font-size="13" font-weight="bold" fill="#ea580c" transform="rotate(-58 165 105)">Thang L ≈ 4,4 m</text>

</svg>