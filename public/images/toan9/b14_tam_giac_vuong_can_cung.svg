<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="100%" height="100%" style="max-width: 420px; max-height: 250px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="410" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn O(210, 140), R = 85 -->
  <circle cx="210" cy="140" r="85" fill="rgba(0, 80, 180, 0.05)" stroke="#0050b4" stroke-width="2" />

  <!-- B(125, 140), C(295, 140), A(210, 55) -->
  <polygon points="210,55 125,140 295,140" fill="rgba(0, 150, 80, 0.1)" stroke="#009650" stroke-width="2.5" />

  <!-- Đường kính BC màu cam -->
  <line x1="125" y1="140" x2="295" y2="140" stroke="#ea580c" stroke-width="3" />

  <!-- Bán kính OA thẳng đứng nét đứt đỏ -->
  <line x1="210" y1="140" x2="210" y2="55" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Vuông góc tại A -->
  <g transform="translate(210, 55) rotate(45)">
    <polyline points="0,12 12,12 12,0" fill="none" stroke="#009650" stroke-width="1.5" />
  </g>

  <!-- Vuông góc tại O -->
  <polyline points="210,125 195,125 195,140" fill="none" stroke="#dc2626" stroke-width="1.5" />

  <!-- Điểm A, B, C, O -->
  <circle cx="210" cy="55" r="4" fill="#0050b4" />
  <text x="210" y="45" font-size="15" font-weight="bold" fill="#0050b4" text-anchor="middle">A</text>

  <circle cx="125" cy="140" r="4" fill="#0050b4" />
  <text x="110" y="145" font-size="15" font-weight="bold" fill="#0050b4">B</text>

  <circle cx="295" cy="140" r="4" fill="#0050b4" />
  <text x="305" y="145" font-size="15" font-weight="bold" fill="#0050b4">C</text>

  <circle cx="210" cy="140" r="4" fill="#dc2626" />
  <text x="215" y="158" font-size="14" font-weight="bold" fill="#dc2626">O</text>

  <!-- Nhãn số đo cung -->
  <text x="145" y="85" font-size="12.5" font-weight="bold" fill="#ea580c">sđ(AB) = 90°</text>
  <text x="275" y="85" font-size="12.5" font-weight="bold" fill="#ea580c">sđ(AC) = 90°</text>
  <text x="210" y="215" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">Cung nửa đường tròn: sđ(BC) = 180°</text>

</svg>