<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="max-width: 400px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="390" height="230" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn O(150, 120), R = 85 -->
  <circle cx="150" cy="120" r="85" fill="rgba(0, 80, 180, 0.05)" stroke="#0050b4" stroke-width="2" />
  
  <!-- Dây AB nằm ngang: khoảng cách d = OH = 32px (đại diện 5cm) -->
  <!-- H(150, 152), chiều dài nửa dây AH = sqrt(85^2 - 32^2) = 78.7px (đại diện 12cm) -->
  <!-- A(71.3, 152), B(228.7, 152) -->
  <line x1="71.3" y1="152" x2="228.7" y2="152" stroke="#009650" stroke-width="3" />
  <circle cx="71.3" cy="152" r="4" fill="#009650" />
  <text x="55" y="156" font-size="14" font-weight="bold" fill="#009650">A</text>

  <circle cx="228.7" cy="152" r="4" fill="#009650" />
  <text x="238" y="156" font-size="14" font-weight="bold" fill="#009650">B</text>

  <!-- Đoạn OH vuông góc AB tại H -->
  <line x1="150" y1="120" x2="150" y2="152" stroke="#dc2626" stroke-width="2" />
  <circle cx="150" cy="152" r="3.5" fill="#dc2626" />
  <text x="155" y="168" font-size="13" font-weight="bold" fill="#dc2626">H</text>
  <polyline points="150,144 142,144 142,152" fill="none" stroke="#dc2626" stroke-width="1.5" />
  <text x="135" y="138" font-size="12" font-weight="bold" fill="#dc2626">5</text>

  <!-- Bán kính OA -->
  <line x1="150" y1="120" x2="71.3" y2="152" stroke="#0050b4" stroke-width="2" stroke-dasharray="4,3" />
  <text x="100" y="125" font-size="12" font-weight="bold" fill="#0050b4">R = 13</text>

  <!-- Tâm O -->
  <circle cx="150" cy="120" r="4" fill="#0050b4" />
  <text x="150" y="110" font-size="14" font-weight="bold" fill="#0050b4" text-anchor="middle">O</text>

  <!-- Hộp giải thuật Pythagore bên phải -->
  <g transform="translate(260, 45)">
    <rect x="0" y="0" width="125" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="12" y="25" font-size="12" font-weight="bold" fill="#1e3a8a">ΔOAH vuông tại H:</text>
    <text x="12" y="50" font-size="11.5" fill="#475569">AH = √(13² - 5²)</text>
    <text x="12" y="70" font-size="12" font-weight="bold" fill="#009650">AH = 12 cm</text>
    <line x1="8" y1="85" x2="117" y2="85" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="12" y="105" font-size="11.5" fill="#475569">Dây AB = 2·AH</text>
    <text x="12" y="130" font-size="13" font-weight="bold" fill="#dc2626">AB = 24 cm</text>
  </g>

</svg>