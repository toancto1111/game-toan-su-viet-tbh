<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="100%" height="100%" style="max-width: 420px; max-height: 270px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>
  
  <!-- Bầu trời -->
  <rect x="10" y="10" width="400" height="200" rx="8" fill="url(#skyGrad)" />
  
  <!-- Bãi cỏ -->
  <rect x="10" y="210" width="400" height="50" fill="#86efac" stroke="#22c55e" stroke-width="1.5" />
  <line x1="10" y1="210" x2="410" y2="210" stroke="#16a34a" stroke-width="2.5" />

  <!-- Cậu bé Nam thả diều -->
  <g transform="translate(45, 150)">
    <!-- Người -->
    <circle cx="12" cy="12" r="9" fill="#fbcfe8" stroke="#0f172a" stroke-width="1.5" />
    <rect x="6" y="21" width="12" height="26" rx="3" fill="#2563eb" />
    <!-- Chân -->
    <line x1="9" y1="47" x2="7" y2="60" stroke="#0f172a" stroke-width="2.5" />
    <line x1="15" y1="47" x2="17" y2="60" stroke="#0f172a" stroke-width="2.5" />
    <!-- Tay cầm dây -->
    <line x1="16" y1="26" x2="30" y2="18" stroke="#0f172a" stroke-width="2" />
    <circle cx="30" cy="18" r="3" fill="#ea580c" />
    <text x="12" y="73" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Nam</text>
  </g>

  <!-- Vị trí diều: (320, 45). Tay Nam: (75, 168) -->
  <!-- Dây diều kéo căng -->
  <line x1="75" y1="168" x2="320" y2="45" stroke="#475569" stroke-width="2" stroke-dasharray="6,2" />

  <!-- Con diều đỏ -->
  <g transform="translate(320, 45)">
    <polygon points="0,-18 16,0 0,22 -16,0" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
    <line x1="0" y1="-18" x2="0" y2="22" stroke="#991b1b" stroke-width="1" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#991b1b" stroke-width="1" />
    <!-- Đuôi diều uốn lượn -->
    <path d="M 0 22 Q -8 32 -4 40 T -2 52" fill="none" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Đường gióng độ cao h -->
  <line x1="320" y1="45" x2="320" y2="168" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="328" y="110" font-size="14" font-weight="bold" fill="#dc2626">h = ? m</text>

  <!-- Đường phương ngang từ tay Nam -->
  <line x1="75" y1="168" x2="335" y2="168" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="306" y="154" width="14" height="14" fill="none" stroke="#64748b" stroke-width="1" />

  <!-- Góc nâng 49 độ -->
  <path d="M 115 168 A 40 40 0 0 0 102 148" fill="none" stroke="#ea580c" stroke-width="2.5" />
  <text x="120" y="156" font-size="13" font-weight="bold" fill="#ea580c">α = 49°</text>

  <!-- Nhãn chiều dài dây diều -->
  <text x="180" y="95" font-size="13" font-weight="bold" fill="#1e3a8a" transform="rotate(-27 180 95)">Dây dài: 8 m</text>

  <!-- Bảng tính toán -->
  <rect x="230" y="180" width="175" height="42" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="240" y="198" font-size="12" font-weight="bold" fill="#0284c7">h = 8 · sin 49° ≈ 6,0 m</text>
  <text x="240" y="214" font-size="11" fill="#64748b">Diều cách mặt đất ≈ 7 m</text>

</svg>