<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hero Images</title>
  <style>
    body { display: flex; flex-wrap: wrap; gap: 10px; background: #333; color: white; }
    .card { border: 1px solid #777; padding: 5px; text-align: center; }
    img { width: 300px; height: auto; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    const container = document.getElementById('container');
    const ids = [];
    for(let i=1; i<=21; i++) ids.push('h3_' + i);
    ids.push('e3_1', 'e3_2', 'e3_3', 'e3_4', 'e3_5');
    
    ids.forEach(id => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <h3>${id}</h3>
        <img src="http://localhost:3000/heroes/allies/${id}.png" onerror="this.src='http://localhost:3000/heroes/enemies/${id}.png'" />
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
