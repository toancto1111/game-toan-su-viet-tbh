<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%" style="max-width: 380px; max-height: 260px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
  </defs>
  
  <circle cx="180" cy="120" r="95" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Hình chữ nhật ABCD: width 152 (8cm), height 114 (6cm). Tâm (180, 120) -->
  <!-- A(104, 63), B(256, 63), C(256, 177), D(104, 177) -->
  <rect x="104" y="63" width="152" height="114" fill="rgba(37, 99, 235, 0.05)" stroke="#0f172a" stroke-width="2.5" />
  
  <!-- 2 đường chéo -->
  <line x1="104" y1="63" x2="256" y2="177" stroke="#64748b" stroke-width="1.5" />
  <line x1="104" y1="177" x2="256" y2="63" stroke="#64748b" stroke-width="1.5" />

  <!-- Tâm O -->
  <circle cx="180" cy="120" r="4.5" fill="#dc2626" />
  <text x="188" y="115" font-size="14" font-weight="bold" fill="#dc2626">O</text>

  <!-- Đỉnh -->
  <text x="90" y="58" font-size="14" font-weight="bold" fill="#0f172a">A</text>
  <text x="262" y="58" font-size="14" font-weight="bold" fill="#0f172a">B</text>
  <text x="262" y="192" font-size="14" font-weight="bold" fill="#0f172a">C</text>
  <text x="90" y="192" font-size="14" font-weight="bold" fill="#0f172a">D</text>

  <!-- Kích thước -->
  <text x="180" y="55" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">8 cm</text>
  <text x="268" y="125" font-size="13" font-weight="bold" fill="#0f172a">6 cm</text>

  <rect x="50" y="225" width="280" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="190" y="242" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">AC = √(8² + 6²) = 10 cm ⇒ R = OA = 5 cm</text>

</svg>