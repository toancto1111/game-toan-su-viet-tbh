<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="100%" height="100%" style="max-width: 320px; max-height: 290px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Tọa độ lục giác đều tâm (160, 130), r = 95 -->
  <!-- 0: (255, 130) B -->
  <!-- 60: (207.5, 212.3) C -->
  <!-- 120: (112.5, 212.3) D -->
  <!-- 180: (65, 130) E -->
  <!-- 240: (112.5, 47.7) F -->
  <!-- 300: (207.5, 47.7) A -->
  <polygon points="208,48 255,130 208,212 112,212 65,130 112,48" fill="rgba(13, 148, 136, 0.08)" stroke="#0d9488" stroke-width="3" />
  
  <!-- 3 đường chéo chính -->
  <line x1="208" y1="48" x2="112" y2="212" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="255" y1="130" x2="65" y2="130" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="208" y1="212" x2="112" y2="48" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Tâm O -->
  <circle cx="160" cy="130" r="4" fill="#dc2626" />
  <text x="168" y="125" font-size="13" font-weight="bold" fill="#dc2626">O</text>

  <!-- Nhãn đỉnh -->
  <text x="215" y="40" font-size="14" font-weight="bold" fill="#1e293b">A</text>
  <text x="268" y="135" font-size="14" font-weight="bold" fill="#1e293b">B</text>
  <text x="215" y="230" font-size="14" font-weight="bold" fill="#1e293b">C</text>
  <text x="98" y="230" font-size="14" font-weight="bold" fill="#1e293b">D</text>
  <text x="45" y="135" font-size="14" font-weight="bold" fill="#1e293b">E</text>
  <text x="98" y="40" font-size="14" font-weight="bold" fill="#1e293b">F</text>

  <text x="245" y="85" font-size="13" font-weight="bold" fill="#0d9488">7 cm</text>
  <text x="160" y="265" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Mỗi đường chéo = 2 × 7 = 14 cm</text>
  <text x="160" y="282" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Tổng 3 đường chéo = 42 cm</text>

</svg>