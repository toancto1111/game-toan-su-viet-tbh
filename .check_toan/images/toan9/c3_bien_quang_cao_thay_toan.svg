<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 240" width="100%" height="100%" style="max-width: 430px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <rect x="25" y="25" width="380" height="135" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="3" />
  <text x="215" y="65" font-size="17" font-weight="bold" fill="#ef4444" text-anchor="middle" letter-spacing="1">TRUNG TÂM TOÁN KHÔI NGUYÊN</text>
  <text x="215" y="105" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">THẦY TOÀN</text>
  <text x="215" y="135" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Chuyên bồi dưỡng Toán 9 ôn thi vào 10</text>

  <!-- Mũi tên kích thước -->
  <line x1="25" y1="12" x2="405" y2="12" stroke="#0284c7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="215" y="9" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">Chiều dài: √75 m (= 5√3 m)</text>

  <line x1="12" y1="25" x2="12" y2="160" stroke="#0284c7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="8" y="95" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle" transform="rotate(-90 8 95)">Rộng: √12 m (= 2√3 m)</text>

  <!-- Kết quả -->
  <rect x="65" y="180" width="300" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="215" y="200" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Diện tích: S = 5√3 · 2√3 = 30 m²</text>
  <text x="215" y="218" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Chu vi: P = 2(5√3 + 2√3) = 14√3 m</text>

</svg>