<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="100%" height="100%" style="max-width: 380px; max-height: 290px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Đỉnh Rubik Isometric 3D -->
  <!-- Mặt trên Top (Y: 20 -> 90) -->
  <polygon points="190,25 295,75 190,125 85,75" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2" />
  <!-- Chia 3x3 mặt trên -->
  <line x1="155" y1="41" x2="260" y2="91" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="120" y1="58" x2="225" y2="108" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="225" y1="41" x2="120" y2="91" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="260" y1="58" x2="155" y2="108" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Mặt trái Left -->
  <polygon points="85,75 190,125 190,235 85,185" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2" />
  <line x1="120" y1="91" x2="120" y2="201" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="155" y1="108" x2="155" y2="218" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="85" y1="112" x2="190" y2="162" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="85" y1="148" x2="190" y2="198" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Mặt phải Right -->
  <polygon points="190,125 295,75 295,185 190,235" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2" />
  <line x1="225" y1="108" x2="225" y2="218" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="260" y1="91" x2="260" y2="201" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="190" y1="162" x2="295" y2="112" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="190" y1="198" x2="295" y2="148" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Mũi tên cạnh a -->
  <line x1="190" y1="248" x2="295" y2="198" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="252" y="235" font-size="14" font-weight="bold" fill="#dc2626">a = ? m</text>

  <!-- Huy hiệu thể tích -->
  <rect x="95" y="250" width="190" height="32" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="190" y="271" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">V = 3,375 m³ ⇒ a = ∛V = 1,5 m</text>

</svg>