<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="max-width: 600px; max-height: 360px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="590" height="350" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="300" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">VÍ DỤ 1: ĐỒ THỊ HÀM SỐ y = 0,5x²</text>

  <!-- Đồ thị bên trái: Tâm O tại (180, 240) -->
  <!-- Trục tọa độ: x từ -3.5 đến 3.5, y từ -0.5 đến 5.5 -->
  <!-- scale x: 38px/đơn vị, scale y: 38px/đơn vị -->
  <g transform="translate(10, 20)">
    <!-- Lưới mờ -->
    <line x1="66" y1="50" x2="66" y2="280" stroke="#f1f5f9" stroke-width="1" />
<line x1="104" y1="50" x2="104" y2="280" stroke="#f1f5f9" stroke-width="1" />
<line x1="142" y1="50" x2="142" y2="280" stroke="#f1f5f9" stroke-width="1" />
<line x1="218" y1="50" x2="218" y2="280" stroke="#f1f5f9" stroke-width="1" />
<line x1="256" y1="50" x2="256" y2="280" stroke="#f1f5f9" stroke-width="1" />
<line x1="294" y1="50" x2="294" y2="280" stroke="#f1f5f9" stroke-width="1" />
    <line x1="30" y1="202" x2="330" y2="202" stroke="#f1f5f9" stroke-width="1" />
<line x1="30" y1="164" x2="330" y2="164" stroke="#f1f5f9" stroke-width="1" />
<line x1="30" y1="126" x2="330" y2="126" stroke="#f1f5f9" stroke-width="1" />
<line x1="30" y1="88" x2="330" y2="88" stroke="#f1f5f9" stroke-width="1" />
<line x1="30" y1="50" x2="330" y2="50" stroke="#f1f5f9" stroke-width="1" />

    <!-- Trục Ox và Oy -->
    <line x1="30" y1="240" x2="330" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <text x="334" y="244" font-size="13" font-weight="bold" fill="#475569">x</text>

    <line x1="180" y1="280" x2="180" y2="40" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
    <text x="185" y="45" font-size="13" font-weight="bold" fill="#475569">y</text>

    <text x="168" y="255" font-size="13" font-weight="bold" fill="#0f172a">O</text>

    <!-- Số trên trục x -->
    <text x="140" y="255" font-size="11" fill="#64748b">-1</text>
    <text x="102" y="255" font-size="11" fill="#64748b">-2</text>
    <text x="64" y="255" font-size="11" fill="#64748b">-3</text>
    <text x="216" y="255" font-size="11" fill="#64748b">1</text>
    <text x="254" y="255" font-size="11" fill="#64748b">2</text>
    <text x="292" y="255" font-size="11" fill="#64748b">3</text>

    <!-- Số trên trục y -->
    <text x="162" y="168" font-size="11" fill="#64748b">2</text>
    <text x="156" y="73" font-size="11" fill="#64748b">4.5</text>

    <!-- Đường gióng nét đứt -->
    <!-- x = +-2, y = 2 (2 * 38 = 76px) -->
    <line x1="104" y1="240" x2="104" y2="164" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="256" y1="240" x2="256" y2="164" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="104" y1="164" x2="256" y2="164" stroke="#94a3b8" stroke-dasharray="3,3" />

    <!-- x = +-3, y = 4.5 (4.5 * 38 = 171px) -->
    <line x1="66" y1="240" x2="66" y2="69" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="294" y1="240" x2="294" y2="69" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="66" y1="69" x2="294" y2="69" stroke="#94a3b8" stroke-dasharray="3,3" />

    <!-- Đường Parabol mượt y = 0.5 * x^2:
         x=-3.2 -> y=5.12 (194px)
         Đỉnh (180, 240)
    -->
    <path d="M 58 45 Q 180 240 302 45" fill="none" stroke="#0284c7" stroke-width="3" />

    <!-- 7 điểm biểu diễn -->
    <circle cx="180" cy="240" r="4.5" fill="#dc2626" />
    <circle cx="218" cy="221" r="3.5" fill="#dc2626" />
    <circle cx="142" cy="221" r="3.5" fill="#dc2626" />
    <circle cx="256" cy="164" r="4" fill="#dc2626" />
    <circle cx="104" cy="164" r="4" fill="#dc2626" />
    <circle cx="294" cy="69" r="4" fill="#dc2626" />
    <circle cx="66" cy="69" r="4" fill="#dc2626" />

    <text x="245" y="55" font-size="13" font-weight="bold" fill="#0284c7">y = ½ x²</text>
  </g>

  <!-- Bảng giá trị và phương pháp bên phải -->
  <g transform="translate(365, 50)">
    <rect x="0" y="0" width="215" height="275" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="215" height="34" rx="10" fill="#0284c7" />
    <text x="107" y="22" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BẢNG GIÁ TRỊ TƯƠNG ỨNG</text>

    <!-- Bảng số -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="195" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <line x1="0" y1="30" x2="195" y2="30" stroke="#cbd5e1" stroke-width="1" />
      <line x1="45" y1="0" x2="45" y2="60" stroke="#cbd5e1" stroke-width="1" />
      <line x1="75" y1="0" x2="75" y2="60" stroke="#cbd5e1" stroke-width="1" />
      <line x1="105" y1="0" x2="105" y2="60" stroke="#cbd5e1" stroke-width="1" />
      <line x1="135" y1="0" x2="135" y2="60" stroke="#cbd5e1" stroke-width="1" />
      <line x1="165" y1="0" x2="165" y2="60" stroke="#cbd5e1" stroke-width="1" />

      <text x="22" y="20" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">x</text>
      <text x="60" y="20" font-size="11" fill="#334155" text-anchor="middle">-2</text>
      <text x="90" y="20" font-size="11" fill="#334155" text-anchor="middle">-1</text>
      <text x="120" y="20" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text>
      <text x="150" y="20" font-size="11" fill="#334155" text-anchor="middle">1</text>
      <text x="180" y="20" font-size="11" fill="#334155" text-anchor="middle">2</text>

      <text x="22" y="50" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">y</text>
      <text x="60" y="50" font-size="11" fill="#334155" text-anchor="middle">2</text>
      <text x="90" y="50" font-size="11" fill="#334155" text-anchor="middle">0.5</text>
      <text x="120" y="50" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text>
      <text x="150" y="50" font-size="11" fill="#334155" text-anchor="middle">0.5</text>
      <text x="180" y="50" font-size="11" fill="#334155" text-anchor="middle">2</text>
    </g>

    <text x="12" y="130" font-size="12" font-weight="bold" fill="#0f172a">Các bước vẽ Parabol:</text>
    <text x="16" y="152" font-size="11" fill="#334155">1. Lập bảng giá trị 5 hoặc 7 điểm đối xứng qua x = 0.</text>
    <text x="16" y="185" font-size="11" fill="#334155">2. Biểu diễn các cặp điểm lên mặt phẳng tọa độ Oxy.</text>
    <text x="16" y="218" font-size="11" fill="#334155">3. Vẽ đường cong trơn mượt đi qua các điểm (không gấp khúc chữ V).</text>

    <text x="12" y="258" font-size="11" font-weight="bold" fill="#16a34a">✓ Đỉnh O(0; 0) là điểm thấp nhất</text>
  </g>

</svg>