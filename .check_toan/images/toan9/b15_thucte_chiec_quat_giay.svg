<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="680" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Tâm chốt quạt O tại (340, 310) -->
  <!-- Góc mở 150 độ: từ 15 độ đến 165 độ (theo góc lượng giác ngược chiều kim đồng hồ) -->
  <!-- R = 230 (đại diện cho R = 25cm), r = 90 (đại diện cho r = 10cm) -->
  <!-- 15 deg: cos=0.9659, sin=-0.2588 -->
  <!-- 165 deg: cos=-0.9659, sin=-0.2588 -->

  <!-- R = 230:
       P_R_right: x = 340 + 230*0.9659 = 562.2, y = 310 - 230*0.2588 = 250.5
       P_R_left:  x = 340 - 230*0.9659 = 117.8, y = 310 - 230*0.2588 = 250.5
       r = 90:
       P_r_right: x = 340 + 90*0.9659 = 426.9, y = 310 - 90*0.2588 = 286.7
       P_r_left:  x = 340 - 90*0.9659 = 253.1, y = 310 - 90*0.2588 = 286.7
  -->

  <!-- Phần nan quạt trần (từ O đến r) -->
  <path d="M 340 310 L 426.9 286.7 A 90 90 0 0 0 253.1 286.7 Z" fill="#fed7aa" fill-opacity="0.4" stroke="#d97706" stroke-width="1.5"/>

  <!-- Phần giấy dán (Vành khuyên từ r=90 đến R=230, góc 150 độ) -->
  <path d="M 426.9 286.7 L 562.2 250.5 A 230 230 0 0 0 117.8 250.5 L 253.1 286.7 A 90 90 0 0 1 426.9 286.7 Z" 
        fill="url(#paperGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>

  <!-- Các nan tre tỏa đều từ tâm O lên viền quạt R (11 nan chính) -->
  <!-- Các góc: 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165 -->
  <g stroke="#92400e" stroke-width="2" opacity="0.8">
    <line x1="340" y1="310" x2="562.2" y2="250.5"/> <!-- 15 deg -->
    <line x1="340" y1="310" x2="539.2" y2="195.0"/> <!-- 30 deg -->
    <line x1="340" y1="310" x2="502.6" y2="147.4"/> <!-- 45 deg -->
    <line x1="340" y1="310" x2="455.0" y2="110.8"/> <!-- 60 deg -->
    <line x1="340" y1="310" x2="399.5" y2="87.8"/>  <!-- 75 deg -->
    <line x1="340" y1="310" x2="340.0" y2="80.0"/>  <!-- 90 deg -->
    <line x1="340" y1="310" x2="280.5" y2="87.8"/>  <!-- 105 deg -->
    <line x1="340" y1="310" x2="225.0" y2="110.8"/> <!-- 120 deg -->
    <line x1="340" y1="310" x2="177.4" y2="147.4"/> <!-- 135 deg -->
    <line x1="340" y1="310" x2="140.8" y2="195.0"/> <!-- 150 deg -->
    <line x1="340" y1="310" x2="117.8" y2="250.5"/> <!-- 165 deg -->
  </g>

  <!-- Chốt quạt tại O -->
  <circle cx="340" cy="310" r="8" fill="#78350f" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="340" cy="310" r="3" fill="#ffffff"/>
  <text x="340" y="332" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">O (Chốt)</text>

  <!-- Ký hiệu góc xòe 150 độ tại tâm -->
  <path d="M 378.6 299.6 A 40 40 0 0 0 301.4 299.6" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="340" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">150°</text>

  <!-- Nhãn kích thước r = 10 cm và R = 25 cm -->
  <!-- Đoạn r = 10cm -->
  <line x1="340" y1="310" x2="426.9" y2="286.7" stroke="#dc2626" stroke-width="3"/>
  <text x="390" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">r = 10 cm</text>

  <!-- Đoạn R = 25cm -->
  <line x1="340" y1="310" x2="117.8" y2="250.5" stroke="#0284c7" stroke-width="3"/>
  <text x="210" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">R = 25 cm</text>

  <!-- Nhãn diện tích giấy dán ở giữa vùng giấy -->
  <g transform="translate(340, 160)" filter="url(#shadow)">
    <rect x="-140" y="-22" width="280" height="44" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
      Phần giấy dán: S<tspan font-size="10" dy="3">giấy</tspan><tspan font-size="14" dy="-3"> ≈ 687 cm²</tspan>
    </text>
  </g>

  <!-- Hộp công thức phía trên cùng -->
  <g transform="translate(340, 35)" filter="url(#shadow)">
    <rect x="-220" y="-18" width="440" height="36" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">
      S = (150°/360°) · π(R² − r²) = (5/12) · π · (25² − 10²) ≈ 687 cm²
    </text>
  </g>

  <text x="340" y="380" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Hình 15.4 — Mô phỏng chiếc quạt giấy xòe 150°: Một phần hình vành khuyên (Annulus Sector)
  </text>
</svg>
