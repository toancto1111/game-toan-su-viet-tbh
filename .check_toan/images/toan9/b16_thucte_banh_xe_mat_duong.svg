<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="#f8fafc"/>

  <!-- Mặt đường asphalt -->
  <rect x="0" y="270" width="600" height="110" fill="url(#roadGrad)"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="#0f172a" stroke-width="4"/>
  <line x1="30" y1="320" x2="150" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="320" x2="360" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="450" y1="320" x2="570" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <text x="580" y="260" font-family="system-ui, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#0f172a" text-anchor="end">
    Mặt đường (Tiếp tuyến d)
  </text>

  <!-- BÁNH XE: Tâm O tại (300, 150), R = 120 (đại diện cho 30cm) -->
  <g filter="url(#shadow)">
    <!-- Lốp ngoài -->
    <circle cx="300" cy="150" r="120" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <circle cx="300" cy="150" r="110" fill="#334155"/>
    <!-- Mâm xe kim loại -->
    <circle cx="300" cy="150" r="95" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>

    <!-- 10 nan hoa mâm đúc -->
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <line x1="300" y1="150" x2="300" y2="55"/>
      <line x1="300" y1="150" x2="300" y2="245"/>
      <line x1="300" y1="150" x2="205" y2="150"/>
      <line x1="300" y1="150" x2="395" y2="150"/>
      <line x1="300" y1="150" x2="233" y2="83"/>
      <line x1="300" y1="150" x2="367" y2="217"/>
      <line x1="300" y1="150" x2="367" y2="83"/>
      <line x1="300" y1="150" x2="233" y2="217"/>
    </g>

    <!-- Trục giữa -->
    <circle cx="300" cy="150" r="22" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <circle cx="300" cy="150" r="8" fill="#ef4444"/>
  </g>

  <!-- Bán kính OH và khoảng cách từ tâm đến mặt đường (300, 150) -> (300, 270) -->
  <line x1="300" y1="150" x2="300" y2="270" stroke="#dc2626" stroke-width="3.5"/>
  <rect x="230" y="195" width="60" height="24" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">
    d = R = 30cm
  </text>

  <!-- Ký hiệu góc vuông tại tiếp điểm H -->
  <rect x="300" y="250" width="16" height="16" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="308" cy="258" r="2" fill="#dc2626"/>

  <!-- Tiếp điểm H -->
  <circle cx="300" cy="270" r="5.5" fill="#ea580c"/>
  <text x="325" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">
    H (Tiếp điểm)
  </text>

  <!-- Tâm O -->
  <text x="280" y="145" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0284c7">O</text>

  <!-- Vectơ trọng lượng P hướng thẳng đứng xuống tâm O -->
  <g filter="url(#shadow)">
    <line x1="300" y1="40" x2="300" y2="120" stroke="#f97316" stroke-width="5"/>
    <polygon points="300,135 292,118 308,118" fill="#f97316"/>
    <rect x="315" y="65" width="135" height="28" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
    <text x="382" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">
      Trọng lượng P →
    </text>
  </g>

  <!-- Chú thích chân hình -->
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Hình 16.3 — Bánh xe tiếp xúc mặt đường: Lực nén vuông góc trực tiếp tại tiếp điểm H
  </text>
</svg>
