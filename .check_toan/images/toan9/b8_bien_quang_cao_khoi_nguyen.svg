<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 240" width="100%" height="100%" style="max-width: 430px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Hai chân cột thép biển quảng cáo -->
  <rect x="110" y="140" width="18" height="90" fill="#64748b" stroke="#334155" stroke-width="2" />
  <rect x="300" y="140" width="18" height="90" fill="#64748b" stroke="#334155" stroke-width="2" />

  <!-- Tấm biển quảng cáo nền xanh đậm -->
  <rect x="25" y="25" width="380" height="130" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3" />
  <rect x="32" y="32" width="366" height="116" rx="6" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Dòng chữ thương hiệu -->
  <text x="215" y="65" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TRUNG TÂM TOÁN KHÔI NGUYÊN</text>
  <text x="215" y="112" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">THẦY TOÀN</text>

  <!-- Mũi tên kích thước -->
  <line x1="25" y1="12" x2="405" y2="12" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="215" y="9" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Chiều dài: √18 m (= 3√2 m)</text>

  <line x1="12" y1="25" x2="12" y2="155" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="8" y="95" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle" transform="rotate(-90 8 95)">Rộng: √2 m</text>

  <!-- Diện tích -->
  <rect x="135" y="180" width="160" height="42" rx="6" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5" />
  <text x="215" y="198" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S = √18 · √2 = √36 = 6 m²</text>
  <text x="215" y="214" font-size="11" fill="#64748b" text-anchor="middle">Chi phí: 6 × 120k = 720.000 đ</text>

</svg>