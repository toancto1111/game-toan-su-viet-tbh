<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pulleyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="680" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Tọa độ:
       Tỉ lệ: 1cm = 12px
       R = 8cm -> 96px
       r = 3cm -> 36px
       d = 13cm -> 156px
       O1H = R - r = 5cm -> 60px
       AB = O2H = 12cm -> 144px
       Đặt O1 tại (200, 190), O2 tại (200 + 156, 190) = (356, 190)
       Góc alpha = arcsin(5/13) ~ 22.62 deg
       Góc tiếp điểm phía trên: 90 + 22.62 = 112.62 deg (tính từ trục ox ngang)
       cos(112.62) = -0.3846, sin(112.62) = 0.923
       Với O1(200, 190), R = 96:
         A: x = 200 - 96*0.3846 = 163.1, y = 190 - 96*0.923 = 101.4
       Với O2(356, 190), r = 36:
         B: x = 356 - 36*0.3846 = 342.2, y = 190 - 36*0.923 = 156.8
       Đoạn AB: từ (163.1, 101.4) đến (342.2, 156.8)
       Tương tự tiếp điểm phía dưới:
         C: x = 163.1, y = 190 + 96*0.923 = 278.6
         D: x = 342.2, y = 190 + 36*0.923 = 223.2
  -->

  <!-- PULI LỚN (O1): R = 96 -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="190" r="96" fill="url(#pulleyGrad)" stroke="#334155" stroke-width="3"/>
    <circle cx="200" cy="190" r="80" fill="#334155"/>
    <circle cx="200" cy="190" r="70" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="200" cy="190" r="18" fill="#475569" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="190" r="6" fill="#0284c7"/>
  </g>

  <!-- PULI NHỎ (O2): r = 36 -->
  <g filter="url(#shadow)">
    <circle cx="460" cy="190" r="36" fill="url(#pulleyGrad)" stroke="#334155" stroke-width="2.5"/>
    <circle cx="460" cy="190" r="28" fill="#334155"/>
    <circle cx="460" cy="190" r="22" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="460" cy="190" r="10" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="460" cy="190" r="4" fill="#ea580c"/>
  </g>

  <!-- ĐOẠN DÂY CUROA BAO QUANH -->
  <!-- Dây căng màu cam đậm bao quanh puli -->
  <!-- Dùng tọa độ thực tế: khoảng cách O1-O2 = 260px (d=13) -> 1cm = 20px, R = 160 (quá lớn) -->
  <!-- Hãy vẽ các đoạn tiếp tuyến chuẩn mực: -->
  <!-- Đoạn tiếp tuyến trên AB: từ (163, 101) tới (446, 157) -->
  <line x1="163" y1="101" x2="446" y2="157" stroke="#ea580c" stroke-width="4.5" filter="url(#shadow)"/>
  <!-- Đoạn tiếp tuyến dưới CD: từ (163, 279) tới (446, 223) -->
  <line x1="163" y1="279" x2="446" y2="223" stroke="#ea580c" stroke-width="4.5" filter="url(#shadow)"/>

  <!-- Vòng cung dây ôm puli lớn -->
  <path d="M 163 101 A 96 96 0 0 0 163 279" fill="none" stroke="#ea580c" stroke-width="4.5"/>
  <!-- Vòng cung dây ôm puli nhỏ -->
  <path d="M 446 157 A 36 36 0 0 1 446 223" fill="none" stroke="#ea580c" stroke-width="4.5"/>

  <!-- Đoạn nối tâm O1O2 = 260px (d = 13cm) -->
  <line x1="200" y1="190" x2="460" y2="190" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="300" y="176" width="80" height="24" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="340" y="193" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
    d = 13 cm
  </text>

  <!-- Bán kính O1A và O2B -->
  <line x1="200" y1="190" x2="163" y2="101" stroke="#0284c7" stroke-width="2"/>
  <text x="165" y="150" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#0284c7">R = 8</text>

  <line x1="460" y1="190" x2="446" y2="157" stroke="#ea580c" stroke-width="2"/>
  <text x="465" y="170" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#ea580c">r = 3</text>

  <!-- Kẻ O2H song song AB, vuông góc O1A tại H -->
  <!-- H nằm trên O1A cách O1 một khoảng R - r = 5cm -> 60px:
       H: x = 200 - 60*0.3846 = 176.9, y = 190 - 60*0.923 = 134.6
  -->
  <line x1="460" y1="190" x2="176.9" y2="134.6" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="176.9" cy="134.6" r="3.5" fill="#16a34a"/>
  <text x="188" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">H</text>

  <text x="195" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">O₁H = 5</text>

  <!-- Tiếp điểm A, B -->
  <circle cx="163" cy="101" r="4.5" fill="#dc2626"/>
  <text x="155" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#dc2626">A</text>

  <circle cx="446" cy="157" r="4" fill="#dc2626"/>
  <text x="455" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#dc2626">B</text>

  <!-- Nhãn đoạn dây curoa tự do AB -->
  <g transform="translate(300, 105)" filter="url(#shadow)">
    <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#c2410c" text-anchor="middle">
      Đoạn dây tự do: AB = 12 cm
    </text>
  </g>

  <!-- Hộp công thức phía dưới -->
  <g transform="translate(340, 320)" filter="url(#shadow)">
    <rect x="-250" y="-16" width="500" height="32" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
      AB = O₂H = √(d² − (R − r)²) = √(13² − (8 − 3)²) = √(169 − 25) = 12 cm
    </text>
  </g>

  <text x="340" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Hình 17.3 — Dự án STEM: Tính toán chiều dài đoạn dây curoa tiếp tuyến chung ngoài của hai puli
  </text>
</svg>
