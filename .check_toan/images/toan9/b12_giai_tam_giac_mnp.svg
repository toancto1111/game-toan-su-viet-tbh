<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" style="max-width: 400px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="390" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Tam giác MNP: M(70, 185), N(310, 185), P(70, 50) -->
  <polygon points="70,185 310,185 70,50" fill="rgba(0, 80, 180, 0.07)" stroke="#0050b4" stroke-width="2.5" />
  
  <!-- Vuông tại M -->
  <polyline points="70,165 90,165 90,185" fill="none" stroke="#0050b4" stroke-width="2" />
  <circle cx="80" cy="175" r="2" fill="#0050b4" />

  <!-- Cung góc N = 35 độ -->
  <path d="M 270 185 A 40 40 0 0 0 282 168" fill="none" stroke="#c80000" stroke-width="2.5" />
  <text x="245" y="175" font-size="13" font-weight="bold" fill="#c80000">35°</text>

  <!-- Góc P = ? (55 độ) -->
  <path d="M 70 85 A 35 35 0 0 0 86 78" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,3" />
  <text x="88" y="100" font-size="12" font-weight="bold" fill="#ea580c">P = 55°</text>

  <!-- Đỉnh M, N, P -->
  <circle cx="70" cy="185" r="3.5" fill="#0050b4" />
  <text x="50" y="200" font-size="15" font-weight="bold" fill="#0050b4">M</text>

  <circle cx="310" cy="185" r="3.5" fill="#0050b4" />
  <text x="320" y="200" font-size="15" font-weight="bold" fill="#0050b4">N</text>

  <circle cx="70" cy="50" r="3.5" fill="#0050b4" />
  <text x="50" y="45" font-size="15" font-weight="bold" fill="#0050b4">P</text>

  <!-- Độ dài MN = 5 cm -->
  <text x="190" y="205" font-size="14" font-weight="bold" fill="#009650" text-anchor="middle">MN = 5 cm</text>

  <!-- MP = ? -->
  <text x="35" y="125" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">MP = ?</text>
  <text x="35" y="142" font-size="11" fill="#64748b" text-anchor="middle">(≈ 3,5 cm)</text>

  <!-- NP = ? -->
  <text x="210" y="105" font-size="13" font-weight="bold" fill="#0284c7" transform="rotate(-30 210 105)" text-anchor="middle">NP = ? (≈ 6,1 cm)</text>

</svg>