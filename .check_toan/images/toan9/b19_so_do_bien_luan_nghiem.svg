<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#607080"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Sơ đồ biện luận số nghiệm phương trình bậc hai</text>
  <!-- Box 1: PT -->
  <rect x="175" y="42" width="350" height="52" rx="8" fill="#dbeeff" stroke="#0054a6" stroke-width="2"/>
  <text x="350" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#0054a6">Phương trình: ax² + bx + c = 0 (a ≠ 0)</text>
  <text x="350" y="81" text-anchor="middle" font-size="12" fill="#0054a6">Tính Δ = b² − 4ac</text>
  <!-- Arrow down -->
  <line x1="350" y1="94" x2="350" y2="128" stroke="#607080" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Diamond decision -->
  <polygon points="350,130 490,175 350,220 210,175" fill="#fff3e0" stroke="#cc6600" stroke-width="2"/>
  <text x="350" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc6600">Dấu của Δ?</text>
  <!-- Δ > 0 arrow left -->
  <line x1="210" y1="175" x2="100" y2="175" stroke="#607080" stroke-width="2" marker-end="url(#arr)"/>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#0054a6">Δ &gt; 0</text>
  <!-- Δ = 0 arrow down -->
  <line x1="350" y1="220" x2="350" y2="270" stroke="#607080" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="252" font-size="11" fill="#0054a6">Δ = 0</text>
  <!-- Δ < 0 arrow right -->
  <line x1="490" y1="175" x2="600" y2="175" stroke="#607080" stroke-width="2" marker-end="url(#arr)"/>
  <text x="545" y="168" text-anchor="middle" font-size="11" fill="#cc0000">Δ &lt; 0</text>
  <!-- Box Delta > 0 -->
  <rect x="5" y="220" width="190" height="100" rx="8" fill="#e8f5e9" stroke="#009060" stroke-width="2"/>
  <text x="100" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#009060">Δ &gt; 0</text>
  <text x="100" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#006040">2 nghiệm phân biệt:</text>
  <text x="100" y="288" text-anchor="middle" font-size="11" fill="#006040">x₁ = (−b+√Δ)/(2a)</text>
  <text x="100" y="305" text-anchor="middle" font-size="11" fill="#006040">x₂ = (−b−√Δ)/(2a)</text>
  <!-- Box Delta = 0 -->
  <rect x="225" y="270" width="250" height="80" rx="8" fill="#e8f5e9" stroke="#009060" stroke-width="2"/>
  <text x="350" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#009060">Δ = 0</text>
  <text x="350" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#006040">Nghiệm kép:</text>
  <text x="350" y="335" text-anchor="middle" font-size="11" fill="#006040">x₁ = x₂ = −b/(2a)</text>
  <!-- Box Delta < 0 -->
  <rect x="505" y="220" width="190" height="80" rx="8" fill="#ffebee" stroke="#cc0000" stroke-width="2"/>
  <text x="600" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc0000">Δ &lt; 0</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#900000">Vô nghiệm</text>
  <text x="600" y="288" text-anchor="middle" font-size="11" fill="#900000">(S = ∅)</text>
  <!-- Divider -->
  <line x1="30" y1="390" x2="670" y2="390" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Delta prime section -->
  <text x="350" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#5500aa">Công thức thu gọn khi b = 2b′: Δ′ = b′² − ac</text>
  <text x="350" y="440" text-anchor="middle" font-size="12" fill="#444">Δ′ &gt; 0 → x₁₂ = (−b′ ± √Δ′) / a</text>
  <text x="350" y="462" text-anchor="middle" font-size="12" fill="#444">Δ′ = 0 → nghiệm kép x = −b′/a</text>
  <text x="350" y="484" text-anchor="middle" font-size="12" fill="#444">Δ′ &lt; 0 → vô nghiệm</text>
  <!-- Note: ac < 0 -->
  <rect x="30" y="498" width="640" height="18" rx="4" fill="#fffde7" stroke="#f5a623" stroke-width="1"/>
  <text x="350" y="511" text-anchor="middle" font-size="11" fill="#7a4f00">⭐ Đặc biệt: a·c &lt; 0 ⟹ Δ &gt; 0 ⟹ PT luôn có 2 nghiệm phân biệt trái dấu</text>
</svg>
