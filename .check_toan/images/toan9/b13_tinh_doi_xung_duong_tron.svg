<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%" style="max-width: 460px; max-height: 260px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="450" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Đường tròn O(170, 130), R = 85 -->
  <circle cx="170" cy="130" r="85" fill="rgba(0, 80, 180, 0.05)" stroke="#0050b4" stroke-width="2.5" />
  <circle cx="170" cy="130" r="4" fill="#c80000" />
  <text x="178" y="148" font-size="15" font-weight="bold" fill="#c80000">O</text>

  <!-- Trục đối xứng d nằm ngang qua O: y = 130 -->
  <line x1="30" y1="130" x2="310" y2="130" stroke="#ea580c" stroke-width="2" stroke-dasharray="8,4,2,4" />
  <text x="315" y="135" font-size="13" font-weight="bold" fill="#ea580c">d (Trục đối xứng)</text>

  <!-- Đối xứng tâm: M(150 độ) và M'(-30 độ) -->
  <!-- M(170 - 85*cos(30), 130 - 85*sin(30)) = (96.4, 87.5) -->
  <!-- M'(170 + 85*cos(30), 130 + 85*sin(30)) = (243.6, 172.5) -->
  <line x1="96.4" y1="87.5" x2="243.6" y2="172.5" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="96.4" cy="87.5" r="4.5" fill="#009650" />
  <text x="78" y="85" font-size="14" font-weight="bold" fill="#009650">M</text>

  <circle cx="243.6" cy="172.5" r="4.5" fill="#009650" />
  <text x="250" y="185" font-size="14" font-weight="bold" fill="#009650">M'</text>

  <!-- Ký hiệu gạch bằng nhau OM = OM' -->
  <line x1="130" y1="104" x2="136" y2="114" stroke="#c80000" stroke-width="2" />
  <line x1="204" y1="146" x2="210" y2="156" stroke="#c80000" stroke-width="2" />

  <!-- Đối xứng trục d: N(40 độ) và N'(-40 độ) -->
  <!-- N: dx = 85*cos(40) = 65.1, dy = -85*sin(40) = -54.6 -> (235.1, 75.4) -->
  <!-- N': dx = 65.1, dy = 54.6 -> (235.1, 184.6) -->
  <line x1="235.1" y1="75.4" x2="235.1" y2="184.6" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="235.1" cy="75.4" r="4.5" fill="#7c3aed" />
  <text x="242" y="75" font-size="14" font-weight="bold" fill="#7c3aed">N</text>

  <circle cx="235.1" cy="184.6" r="4.5" fill="#7c3aed" />
  <text x="242" y="195" font-size="14" font-weight="bold" fill="#7c3aed">N'</text>

  <!-- Vuông góc tại H(235.1, 130) -->
  <polyline points="220,130 220,115 235.1,115" fill="none" stroke="#7c3aed" stroke-width="1.5" />

  <!-- Chú thích tóm tắt -->
  <g transform="translate(30, 215)">
    <rect x="0" y="0" width="390" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="195" y="18" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Tâm đối xứng O duy nhất  |  VÔ SỐ Trục đối xứng (mọi đường thẳng qua O)</text>
  </g>

</svg>