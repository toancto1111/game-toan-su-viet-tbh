<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%" style="max-width: 360px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
  </defs>
  
  <path d="M 60 120 A 130 130 0 0 1 260 120 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2.5" />
  <line x1="60" y1="120" x2="260" y2="120" stroke="#0f172a" stroke-width="2" />
  
  <!-- Cột cao MH ở giữa -->
  <line x1="160" y1="120" x2="160" y2="82" stroke="#dc2626" stroke-width="2.5" />
  <circle cx="160" cy="82" r="3.5" fill="#dc2626" />
  <text x="160" y="74" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">M (đỉnh)</text>
  <text x="160" y="136" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">H</text>

  <text x="48" y="125" font-size="14" font-weight="bold" fill="#0f172a">A</text>
  <text x="268" y="125" font-size="14" font-weight="bold" fill="#0f172a">B</text>

  <line x1="60" y1="150" x2="260" y2="150" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)" />
  <text x="160" y="168" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Khẩu độ AB = 10 m</text>
  <text x="180" y="103" font-size="12" font-weight="bold" fill="#dc2626">2 m</text>

  <rect x="50" y="195" width="260" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="180" y="212" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">R² = (R - 2)² + 5² ⇒ R = 7,25 m</text>

</svg>