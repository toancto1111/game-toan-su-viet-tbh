<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" style="max-width: 400px; max-height: 280px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>
  
  <!-- Tường gạch nhà -->
  <rect x="20" y="20" width="80" height="200" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" />
  <!-- Họa tiết gạch -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#f0abfc" stroke-width="1" />
  <line x1="20" y1="100" x2="100" y2="100" stroke="#f0abfc" stroke-width="1" />
  <line x1="20" y1="140" x2="100" y2="140" stroke="#f0abfc" stroke-width="1" />
  <line x1="20" y1="180" x2="100" y2="180" stroke="#f0abfc" stroke-width="1" />

  <!-- Mặt đất bê tông -->
  <rect x="20" y="220" width="360" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="20" y1="220" x2="380" y2="220" stroke="#475569" stroke-width="3" />

  <!-- Ký hiệu góc vuông tại chân tường -->
  <rect x="100" y="206" width="14" height="14" fill="none" stroke="#0f172a" stroke-width="1.5" />

  <!-- Chiếc thang tựa tường: chân tại (190, 220), đầu thang tại (100, 40) -->
  <!-- Độ cao tường: 180px tương ứng 3m. Chiều dài thang: 201px tương ứng 3.2m -->
  <line x1="190" y1="220" x2="100" y2="40" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
  <!-- Bậc thang -->
  <line x1="172" y1="184" x2="178" y2="184" stroke="#ffffff" stroke-width="3" />
  <line x1="154" y1="148" x2="160" y2="148" stroke="#ffffff" stroke-width="3" />
  <line x1="136" y1="112" x2="142" y2="112" stroke="#ffffff" stroke-width="3" />
  <line x1="118" y1="76" x2="124" y2="76" stroke="#ffffff" stroke-width="3" />

  <!-- Kích thước chiều cao tường 3m -->
  <line x1="115" y1="40" x2="115" y2="220" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="122" y="135" font-size="13" font-weight="bold" fill="#dc2626">3 m</text>

  <!-- Kích thước thang 3.2m -->
  <text x="165" y="115" font-size="13" font-weight="bold" fill="#ea580c" transform="rotate(-63 165 115)">Thang: 3,2 m</text>

  <!-- Góc alpha -->
  <path d="M 155 220 A 35 35 0 0 1 176 192" fill="none" stroke="#16a34a" stroke-width="2.5" />
  <text x="145" y="210" font-size="14" font-weight="bold" fill="#16a34a">α</text>

  <!-- Hộp kết quả & quy tắc -->
  <rect x="220" y="30" width="165" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="230" y="52" font-size="12" font-weight="bold" fill="#0f172a">sin α = 3 / 3,2 = 0,9375</text>
  <text x="230" y="72" font-size="13" font-weight="bold" fill="#16a34a">⇒ α ≈ 69°38'</text>
  <text x="230" y="92" font-size="11" font-weight="bold" fill="#ea580c">✓ Đạt chuẩn (65° - 75°)</text>

  <rect x="180" y="150" width="190" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
  <text x="190" y="168" font-size="11" font-weight="bold" fill="#92400e">Quy tắc 1/4 trong an toàn:</text>
  <text x="190" y="185" font-size="10" fill="#92400e">Chân thang cách tường ≈ L/4</text>

</svg>