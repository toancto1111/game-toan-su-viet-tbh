<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="100%" height="100%" style="max-width: 420px; max-height: 250px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <rect x="10" y="10" width="400" height="230" rx="14" fill="#0284c7" stroke="#0369a1" stroke-width="3" />
  <!-- Vạch phân làn -->
  <line x1="140" y1="10" x2="140" y2="240" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,8" />
  <line x1="280" y1="10" x2="280" y2="240" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,8" />
  
  <!-- Làn 1: Ô tô con -->
  <g transform="translate(75, 70)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#ef4444" stroke-width="6" />
    <text x="0" y="12" font-size="30" font-weight="900" fill="#1e293b" text-anchor="middle">60</text>
  </g>
  <!-- Ô tô silhouette -->
  <g transform="translate(45, 155)">
    <rect x="0" y="20" width="60" height="22" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <path d="M 10 20 L 18 5 L 42 5 L 50 20 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="15" cy="42" r="7" fill="#1e293b" />
    <circle cx="45" cy="42" r="7" fill="#1e293b" />
    <text x="30" y="65" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Ô tô con</text>
    <text x="30" y="78" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">v ≤ 60 km/h</text>
  </g>

  <!-- Làn 2: Xe tải -->
  <g transform="translate(210, 70)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#ef4444" stroke-width="6" />
    <text x="0" y="12" font-size="30" font-weight="900" fill="#1e293b" text-anchor="middle">50</text>
  </g>
  <g transform="translate(178, 155)">
    <rect x="0" y="10" width="45" height="32" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <rect x="45" y="20" width="18" height="22" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="12" cy="42" r="7" fill="#1e293b" />
    <circle cx="32" cy="42" r="7" fill="#1e293b" />
    <circle cx="54" cy="42" r="7" fill="#1e293b" />
    <text x="32" y="65" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Xe tải / Khách</text>
    <text x="32" y="78" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">v ≤ 50 km/h</text>
  </g>

  <!-- Làn 3: Xe máy -->
  <g transform="translate(350, 70)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#ef4444" stroke-width="6" />
    <text x="0" y="12" font-size="30" font-weight="900" fill="#1e293b" text-anchor="middle">50</text>
  </g>
  <g transform="translate(322, 160)">
    <circle cx="12" cy="35" r="9" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="45" cy="35" r="9" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 12 35 L 28 35 L 38 18 L 45 35" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <text x="28" y="60" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Mô tô / Xe máy</text>
    <text x="28" y="73" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">v ≤ 50 km/h</text>
  </g>

</svg>