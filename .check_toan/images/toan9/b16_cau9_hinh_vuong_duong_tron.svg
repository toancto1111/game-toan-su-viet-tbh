<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="440" height="380" rx="14" fill="#f8fafc"/>

  <!-- Hình vuông ABCD: A(100, 240), B(300, 240), C(300, 40), D(100, 40) cạnh 200px (10cm) -->
  <!-- Đường tròn (A; R=7cm): tâm A(100, 240), r = 140px -->

  <!-- Cung tròn (A; 7) -->
  <circle cx="100" cy="240" r="140" fill="#eff6ff" fill-opacity="0.5" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- 4 đường thẳng chứa 4 cạnh -->
  <!-- Đường thẳng AB (ngang y = 240, đi qua tâm A -> Cát tuyến) -->
  <line x1="40" y1="240" x2="360" y2="240" stroke="#16a34a" stroke-width="2.5"/>
  <text x="370" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">đt AB (Cát tuyến)</text>

  <!-- Đường thẳng AD (đứng x = 100, đi qua tâm A -> Cát tuyến) -->
  <line x1="100" y1="300" x2="100" y2="10" stroke="#16a34a" stroke-width="2.5"/>
  <text x="100" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">đt AD (Cát tuyến)</text>

  <!-- Đường thẳng BC (đứng x = 300, cách A 10cm > 7cm -> Không giao) -->
  <line x1="300" y1="300" x2="300" y2="10" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="300" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">đt BC (Không giao)</text>

  <!-- Đường thẳng CD (ngang y = 40, cách A 10cm > 7cm -> Không giao) -->
  <line x1="40" y1="40" x2="360" y2="40" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="370" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">đt CD (Không giao)</text>

  <!-- Hình vuông ABCD nổi bật -->
  <rect x="100" y="40" width="200" height="200" fill="#fed7aa" fill-opacity="0.2" stroke="#ea580c" stroke-width="2"/>

  <!-- Các đỉnh A, B, C, D -->
  <circle cx="100" cy="240" r="5" fill="#0284c7"/>
  <text x="80" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">A (Tâm)</text>

  <circle cx="300" cy="240" r="4.5" fill="#ea580c"/>
  <text x="310" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">B</text>

  <circle cx="300" cy="40" r="4.5" fill="#ea580c"/>
  <text x="310" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">C</text>

  <circle cx="100" cy="40" r="4.5" fill="#ea580c"/>
  <text x="80" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">D</text>

  <!-- Bán kính R = 7 -->
  <line x1="100" y1="240" x2="199" y2="141" stroke="#0284c7" stroke-width="2"/>
  <text x="135" y="180" font-family="system-ui, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#0284c7">R = 7</text>

  <!-- Kích thước cạnh 10cm -->
  <text x="200" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">10 cm</text>

  <!-- Hộp kết quả -->
  <g transform="translate(220, 355)" filter="url(#shadow)">
    <rect x="-140" y="-12" width="280" height="24" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">
      Có 2 đường thẳng không giao: đt BC và đt CD
    </text>
  </g>
</svg>
