<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="100%" height="100%" style="max-width: 640px; max-height: 350px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="630" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="320" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">ĐỒ THỊ HÀM SỐ y = ax² (a ≠ 0) — ĐƯỜNG PARABOL</text>

  <!-- PANEL TRÁI: a > 0 (y = x^2) -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="145" y="22" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">Trường hợp a &gt; 0 (Đỉnh O thấp nhất)</text>

    <!-- Lưới tọa độ: Gốc O tại (145, 220), scale x: 35px/đơn vị, scale y: 35px/đơn vị -->
    <!-- Trục Ox và Oy -->
    <line x1="20" y1="220" x2="270" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="272" y="224" font-size="12" font-weight="bold" fill="#64748b">x</text>

    <line x1="145" y1="260" x2="145" y2="35" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="150" y="42" font-size="12" font-weight="bold" fill="#64748b">y</text>

    <!-- Gốc O -->
    <text x="133" y="235" font-size="12" font-weight="bold" fill="#0f172a">O</text>

    <!-- Vạch chia trục Ox -->
    <text x="108" y="234" font-size="10" fill="#64748b">-1</text>
    <text x="73" y="234" font-size="10" fill="#64748b">-2</text>
    <text x="178" y="234" font-size="10" fill="#64748b">1</text>
    <text x="213" y="234" font-size="10" fill="#64748b">2</text>

    <!-- Vạch chia trục Oy -->
    <text x="130" y="188" font-size="10" fill="#64748b">1</text>
    <text x="130" y="83" font-size="10" fill="#64748b">4</text>

    <!-- Đường nét đứt gióng tọa độ -->
    <line x1="75" y1="220" x2="75" y2="80" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="215" y1="220" x2="215" y2="80" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="75" y1="80" x2="215" y2="80" stroke="#94a3b8" stroke-dasharray="3,3" />

    <line x1="110" y1="220" x2="110" y2="185" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="180" y1="220" x2="180" y2="185" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="110" y1="185" x2="180" y2="185" stroke="#94a3b8" stroke-dasharray="3,3" />

    <!-- Đường cong Parabol y = x^2:
         x từ -2.2 (-77px) đến 2.2 (+77px)
         y = (x/35)^2 * 35
    -->
    <path d="M 68 76 Q 145 230 222 76" fill="none" stroke="#0284c7" stroke-width="2.5" />

    <!-- 5 điểm đặc biệt -->
    <circle cx="145" cy="220" r="4" fill="#dc2626" />
    <circle cx="180" cy="185" r="3.5" fill="#dc2626" />
    <circle cx="110" cy="185" r="3.5" fill="#dc2626" />
    <circle cx="215" cy="80" r="3.5" fill="#dc2626" />
    <circle cx="75" cy="80" r="3.5" fill="#dc2626" />

    <text x="210" y="65" font-size="12" font-weight="bold" fill="#0284c7">y = ax² (a &gt; 0)</text>
    <text x="145" y="265" font-size="11" fill="#64748b" text-anchor="middle">• Trục Oy đối xứng  • Nằm trên Ox</text>
  </g>

  <!-- PANEL PHẢI: a < 0 (y = -x^2) -->
  <g transform="translate(330, 45)">
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="145" y="22" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">Trường hợp a &lt; 0 (Đỉnh O cao nhất)</text>

    <!-- Trục Ox và Oy: Gốc O tại (145, 80) -->
    <line x1="20" y1="80" x2="270" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="272" y="84" font-size="12" font-weight="bold" fill="#64748b">x</text>

    <line x1="145" y1="260" x2="145" y2="35" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="150" y="42" font-size="12" font-weight="bold" fill="#64748b">y</text>

    <!-- Gốc O -->
    <text x="133" y="73" font-size="12" font-weight="bold" fill="#0f172a">O</text>

    <!-- Vạch chia trục Ox -->
    <text x="108" y="72" font-size="10" fill="#64748b">-1</text>
    <text x="73" y="72" font-size="10" fill="#64748b">-2</text>
    <text x="178" y="72" font-size="10" fill="#64748b">1</text>
    <text x="213" y="72" font-size="10" fill="#64748b">2</text>

    <!-- Vạch chia trục Oy -->
    <text x="125" y="118" font-size="10" fill="#64748b">-1</text>
    <text x="125" y="223" font-size="10" fill="#64748b">-4</text>

    <!-- Gióng tọa độ -->
    <line x1="75" y1="80" x2="75" y2="220" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="215" y1="80" x2="215" y2="220" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="75" y1="220" x2="215" y2="220" stroke="#94a3b8" stroke-dasharray="3,3" />

    <line x1="110" y1="80" x2="110" y2="115" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="180" y1="80" x2="180" y2="115" stroke="#94a3b8" stroke-dasharray="3,3" />
    <line x1="110" y1="115" x2="180" y2="115" stroke="#94a3b8" stroke-dasharray="3,3" />

    <!-- Parabol úp ngược y = -x^2 -->
    <path d="M 68 224 Q 145 70 222 224" fill="none" stroke="#ea580c" stroke-width="2.5" />

    <!-- 5 điểm -->
    <circle cx="145" cy="80" r="4" fill="#dc2626" />
    <circle cx="180" cy="115" r="3.5" fill="#dc2626" />
    <circle cx="110" cy="115" r="3.5" fill="#dc2626" />
    <circle cx="215" cy="220" r="3.5" fill="#dc2626" />
    <circle cx="75" cy="220" r="3.5" fill="#dc2626" />

    <text x="210" y="245" font-size="12" font-weight="bold" fill="#ea580c">y = ax² (a &lt; 0)</text>
    <text x="145" y="265" font-size="11" fill="#64748b" text-anchor="middle">• Trục Oy đối xứng  • Nằm dưới Ox</text>
  </g>

</svg>