<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" width="100%" height="100%" style="max-width: 580px; max-height: 360px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0050b4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c80000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#009650" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
  </defs>
  
  <rect x="5" y="5" width="570" height="350" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="290" y="28" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">BÀI TOÁN THỰC TẾ: BÁNH XE CÚT KÍT QUA BẬC THỀM</text>

  <!-- Mặt đất và bậc thềm -->
  <!-- Đất từ x=30 đến x=260 ở y=270 -->
  <rect x="25" y="270" width="530" height="65" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
  <!-- Khối bậc thềm từ x=260 đến x=555, cao 40px (10cm), đỉnh ở y=230 -->
  <rect x="260" y="230" width="295" height="105" fill="#94a3b8" stroke="#475569" stroke-width="2" />

  <!-- Đường biên mặt đất và bậc thềm -->
  <line x1="25" y1="270" x2="260" y2="270" stroke="#334155" stroke-width="3" />
  <line x1="260" y1="270" x2="260" y2="230" stroke="#334155" stroke-width="3" />
  <line x1="260" y1="230" x2="555" y2="230" stroke="#334155" stroke-width="3" />

  <!-- Chiều cao bậc thềm h=10cm (40px) -->
  <line x1="275" y1="270" x2="275" y2="230" stroke="#ea580c" stroke-width="2" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)" />
  <text x="285" y="255" font-size="13" font-weight="bold" fill="#ea580c">h = 10 cm</text>

  <!-- Bánh xe: Tâm O(180, 170), R = 100px (25cm) -->
  <!-- Lốp ngoài -->
  <circle cx="180" cy="170" r="100" fill="#334155" stroke="#0f172a" stroke-width="3" />
  <!-- Vành trong -->
  <circle cx="180" cy="170" r="82" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
  <!-- Trục bánh xe -->
  <circle cx="180" cy="170" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
  <circle cx="180" cy="170" r="5" fill="#0f172a" />
  <!-- Nan hoa -->
  <line x1="198.0" y1="170.0" x2="262.0" y2="170.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="192.7" y1="182.7" x2="238.0" y2="228.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="180.0" y1="188.0" x2="180.0" y2="252.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="167.3" y1="182.7" x2="122.0" y2="228.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="162.0" y1="170.0" x2="98.0" y2="170.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="167.3" y1="157.3" x2="122.0" y2="112.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="180.0" y1="152.0" x2="180.0" y2="88.0" stroke="#cbd5e1" stroke-width="2" />
<line x1="192.7" y1="157.3" x2="238.0" y2="112.0" stroke="#cbd5e1" stroke-width="2" />

  <!-- Các điểm:
       O(180, 170)
       A(180, 270) - tiếp xúc đất
       B(260, 230) - chạm mép bậc thềm
       C(260, 270) - chân bậc thềm
       H(180, 230) - chân đường vuông góc từ B đến OA
  -->
  <!-- Đoạn thẳng OA, OB -->
  <line x1="180" y1="170" x2="180" y2="270" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="145" y="215" font-size="12" font-weight="bold" fill="#0284c7">R=25</text>

  <line x1="180" y1="170" x2="260" y2="230" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="225" y="195" font-size="12" font-weight="bold" fill="#0284c7">R=25</text>

  <!-- Đoạn BH (H nằm trên OA) -->
  <line x1="260" y1="230" x2="180" y2="230" stroke="#059669" stroke-width="2.5" stroke-dasharray="4,3" />
  <text x="210" y="222" font-size="12" font-weight="bold" fill="#059669">HB = ?</text>

  <!-- Ký hiệu góc vuông tại H(180, 230) -->
  <rect x="180" y="218" width="12" height="12" fill="none" stroke="#059669" stroke-width="1.5" />

  <!-- Đoạn d = AC cần tìm dưới đất -->
  <line x1="180" y1="290" x2="260" y2="290" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <text x="220" y="310" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">d = AC = 20 cm</text>

  <!-- Điểm và nhãn -->
  <circle cx="180" cy="170" r="4.5" fill="#dc2626" />
  <text x="175" y="158" font-size="14" font-weight="bold" fill="#dc2626">O</text>

  <circle cx="180" cy="270" r="4.5" fill="#dc2626" />
  <text x="175" y="285" font-size="14" font-weight="bold" fill="#dc2626">A</text>

  <circle cx="260" cy="230" r="5" fill="#ea580c" />
  <text x="268" y="225" font-size="14" font-weight="bold" fill="#ea580c">B (mép thềm)</text>

  <circle cx="260" cy="270" r="4.5" fill="#0f172a" />
  <text x="265" y="285" font-size="14" font-weight="bold" fill="#0f172a">C</text>

  <circle cx="180" cy="230" r="4.5" fill="#059669" />
  <text x="165" y="235" font-size="14" font-weight="bold" fill="#059669">H</text>

  <!-- Khung giải thuật Pythagore bên phải -->
  <g transform="translate(370, 45)">
    <rect x="0" y="0" width="195" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="195" height="32" rx="10" fill="#059669" />
    <text x="97" y="21" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">PHÂN TÍCH PYTHAGORE</text>

    <text x="12" y="55" font-size="11.5" fill="#334155">• OA = R = 25 cm</text>
    <text x="12" y="75" font-size="11.5" fill="#334155">• AH = BC = h = 10 cm</text>
    <text x="12" y="95" font-size="11.5" font-weight="bold" fill="#0284c7">⇒ OH = 25 - 10 = 15 cm</text>
    
    <text x="12" y="120" font-size="11.5" fill="#334155">• Trong ΔOHB vuông tại H:</text>
    <text x="16" y="140" font-size="11.5" fill="#334155">HB = √(OB² - OH²)</text>
    <text x="16" y="160" font-size="13" font-weight="bold" fill="#dc2626">= √(25² - 15²) = 20 cm</text>
  </g>

</svg>