<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%" style="max-width: 400px; max-height: 220px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
