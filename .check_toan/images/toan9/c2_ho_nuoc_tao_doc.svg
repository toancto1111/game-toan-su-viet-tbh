<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="100%" style="max-width: 420px; max-height: 240px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Bờ hồ sinh thái -->
  <ellipse cx="210" cy="130" rx="190" ry="95" fill="#bae6fd" stroke="#0284c7" stroke-width="3" />
  
  <!-- Các vệt tảo xanh -->
  <ellipse cx="140" cy="130" rx="45" ry="25" fill="#15803d" opacity="0.65" />
  <ellipse cx="270" cy="110" rx="35" ry="20" fill="#15803d" opacity="0.65" />
  <ellipse cx="200" cy="165" rx="30" ry="15" fill="#15803d" opacity="0.6" />
  <ellipse cx="100" cy="150" rx="25" ry="12" fill="#15803d" opacity="0.55" />

  <!-- Thuyền máy hút lọc tảo -->
  <g transform="translate(60, 95)">
    <polygon points="0,15 50,15 42,28 8,28" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
    <rect x="15" y="4" width="22" height="11" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" />
    <line x1="50" y1="20" x2="70" y2="35" stroke="#0284c7" stroke-width="3" />
    <text x="25" y="12" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">LỌC</text>
  </g>

  <!-- Nhãn công thức & chi phí -->
  <rect x="30" y="15" width="200" height="42" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" />
  <text x="130" y="32" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Mô hình: C(x) = 50x / (100 - x)</text>
  <text x="130" y="48" font-size="11" fill="#64748b" text-anchor="middle">x: % tảo lọc (0 ≤ x &lt; 100)</text>

  <rect x="250" y="15" width="145" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="322" y="32" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Ngân sách: 450 tr</text>
  <text x="322" y="48" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Lọc được: x = 90%</text>

</svg>