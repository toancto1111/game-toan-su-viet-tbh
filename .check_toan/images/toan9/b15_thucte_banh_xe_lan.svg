<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Nền trời và mặt đất -->
  <rect width="760" height="380" rx="16" fill="url(#skyGrad)"/>
  
  <!-- Mặt đường asphalt -->
  <rect x="0" y="270" width="760" height="110" fill="url(#roadGrad)"/>
  <line x1="0" y1="270" x2="760" y2="270" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Vạch kẻ đường -->
  <line x1="20" y1="320" x2="120" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="320" x2="280" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="320" x2="440" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="320" x2="600" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="660" y1="320" x2="740" y2="320" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

  <!-- BÁNH XE 1: Vị trí ban đầu Tâm O1(160, 180), R = 90 -->
  <g filter="url(#shadow)">
    <!-- Lốp ngoài màu đen -->
    <circle cx="160" cy="180" r="90" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <!-- Gai lốp viền -->
    <circle cx="160" cy="180" r="84" fill="#334155"/>
    <!-- Vành kim loại -->
    <circle cx="160" cy="180" r="76" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Nan hoa xe đạp (12 nan cách đều 30 độ) -->
    <g stroke="#64748b" stroke-width="1.8">
      <line x1="160" y1="180" x2="236" y2="180"/>
      <line x1="160" y1="180" x2="84" y2="180"/>
      <line x1="160" y1="180" x2="160" y2="104"/>
      <line x1="160" y1="180" x2="160" y2="256"/>
      <line x1="160" y1="180" x2="225.8" y2="142"/>
      <line x1="160" y1="180" x2="94.2" y2="218"/>
      <line x1="160" y1="180" x2="94.2" y2="142"/>
      <line x1="160" y1="180" x2="225.8" y2="218"/>
      <line x1="160" y1="180" x2="198" y2="114.2"/>
      <line x1="160" y1="180" x2="122" y2="245.8"/>
      <line x1="160" y1="180" x2="122" y2="114.2"/>
      <line x1="160" y1="180" x2="198" y2="245.8"/>
    </g>

    <!-- Trục giữa -->
    <circle cx="160" cy="180" r="14" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <circle cx="160" cy="180" r="6" fill="#ef4444"/>

    <!-- Đường kính d = 650 mm -->
    <line x1="84" y1="180" x2="236" y2="180" stroke="#0284c7" stroke-width="3"/>
    <rect x="110" y="166" width="100" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <text x="160" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">
      d = 650 mm
    </text>

    <!-- Mũi tên chỉ chiều quay -->
    <path d="M 215 110 A 75 75 0 0 1 255 175" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="255,185 248,168 262,172" fill="#ef4444"/>
    <text x="250" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Quay</text>
  </g>

  <!-- Điểm chạm đất ban đầu A -->
  <circle cx="160" cy="270" r="6" fill="#dc2626"/>
  <text x="160" y="295" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

  <!-- BÁNH XE 2: Vị trí sau khi lăn 1 vòng Tâm O2(600, 180), R = 90 (Nét đứt mờ) -->
  <g opacity="0.6">
    <circle cx="600" cy="180" r="90" fill="#334155" fill-opacity="0.2" stroke="#1e293b" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="600" cy="180" r="76" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="600" cy="180" r="14" fill="#64748b"/>
    <circle cx="600" cy="180" r="6" fill="#ef4444"/>
    <!-- Bán kính đi xuống chạm đất B -->
    <line x1="600" y1="180" x2="600" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="4,4"/>
  </g>

  <!-- Điểm chạm đất sau 1 vòng B -->
  <circle cx="600" cy="270" r="6" fill="#dc2626"/>
  <text x="600" y="295" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Mũi tên tịnh tiến của xe -->
  <line x1="260" y1="180" x2="480" y2="180" stroke="#f97316" stroke-width="3" stroke-dasharray="8,6"/>
  <polygon points="500,180 480,173 480,187" fill="#f97316"/>
  <text x="380" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">
    Hướng di chuyển của xe →
  </text>

  <!-- Đoạn khoảng cách lăn 1 vòng AB = Chu vi C -->
  <g transform="translate(0, -20)">
    <line x1="160" y1="270" x2="600" y2="270" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="160" y1="260" x2="160" y2="280" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="600" y1="260" x2="600" y2="280" stroke="#16a34a" stroke-width="3.5"/>
    <rect x="250" y="248" width="260" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">
      1 vòng = Chu vi C = π · d ≈ 2,042 m
    </text>
  </g>

  <!-- Hộp tóm tắt bài toán thực tế phía trên -->
  <g transform="translate(380, 42)" filter="url(#shadow)">
    <rect x="-240" y="-22" width="480" height="44" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
      🚲 Sau 500 vòng: Quãng đường S = 500 · C ≈ 500 · 2,042 ≈ 1 021 mét
    </text>
  </g>

  <text x="380" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Hình 15.3 — Mô phỏng bánh xe lăn không trượt: Quãng đường 1 vòng đúng bằng chu vi bánh xe
  </text>
</svg>
