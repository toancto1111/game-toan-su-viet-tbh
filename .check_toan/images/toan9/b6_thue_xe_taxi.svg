<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%" style="max-width: 420px; max-height: 230px; display: block; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
    </marker>
    <pattern id="hatch-blue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Đường lộ -->
  <rect x="10" y="120" width="400" height="70" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <line x1="10" y1="155" x2="410" y2="155" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,10" />

  <!-- Chiếc xe taxi 16 chỗ -->
  <g transform="translate(30, 75)">
    <rect x="0" y="18" width="130" height="48" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <rect x="10" y="24" width="28" height="20" rx="2" fill="#38bdf8" />
    <rect x="45" y="24" width="28" height="20" rx="2" fill="#38bdf8" />
    <rect x="80" y="24" width="38" height="20" rx="2" fill="#38bdf8" />
    <circle cx="30" cy="66" r="12" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <circle cx="100" cy="66" r="12" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <rect x="45" y="5" width="40" height="13" rx="2" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" />
    <text x="65" y="15" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">TAXI 16C</text>
  </g>

  <!-- Mốc cước phí -->
  <rect x="20" y="15" width="150" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="95" y="32" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Mở cửa: 15.000 đ</text>
  <text x="95" y="48" font-size="11" fill="#1e40af" text-anchor="middle">Cộng thêm 12.000 đ / km</text>

  <!-- Mũi tên quãng đường -->
  <line x1="170" y1="110" x2="380" y2="110" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="275" y="100" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Quãng đường x (km)</text>

  <!-- Cột mốc đích -->
  <line x1="380" y1="65" x2="380" y2="155" stroke="#0f172a" stroke-width="2" />
  <rect x="345" y="35" width="70" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="380" y="54" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Quỹ ≤ 200k</text>

  <!-- Công thức liên hệ -->
  <rect x="60" y="195" width="300" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <text x="210" y="215" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Bất phương trình: 15 + 12x ≤ 200 ⇒ x ≤ 15,4 km</text>

</svg>