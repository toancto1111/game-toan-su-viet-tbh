<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%">
  <defs>
    <linearGradient id="flywheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="420" height="340" rx="14" fill="#f8fafc"/>

  <!-- Bánh đà động cơ Tâm O(210, 160), R = 100 (40cm) -->
  <g filter="url(#shadow)">
    <!-- Vành ngoài kim loại đúc -->
    <circle cx="210" cy="160" r="100" fill="url(#flywheelGrad)" stroke="#0f172a" stroke-width="4"/>
    <circle cx="210" cy="160" r="88" fill="#334155"/>
    <circle cx="210" cy="160" r="75" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

    <!-- 6 nan đúc bánh đà -->
    <g stroke="#475569" stroke-width="8" stroke-linecap="round">
      <line x1="210" y1="160" x2="285" y2="160"/>
      <line x1="210" y1="160" x2="135" y2="160"/>
      <line x1="210" y1="160" x2="247.5" y2="95"/>
      <line x1="210" y1="160" x2="172.5" y2="225"/>
      <line x1="210" y1="160" x2="172.5" y2="95"/>
      <line x1="210" y1="160" x2="247.5" y2="225"/>
    </g>

    <!-- Trục cốt máy ở tâm -->
    <circle cx="210" cy="160" r="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="210" cy="160" r="8" fill="#ef4444"/>

    <!-- Điểm P trên vành ngoài -->
    <circle cx="310" cy="160" r="6" fill="#dc2626"/>
    <text x="325" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#dc2626">P</text>

    <!-- Bán kính R = 40 cm -->
    <line x1="210" y1="160" x2="210" y2="60" stroke="#0284c7" stroke-width="2.5"/>
    <text x="220" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">R = 40 cm</text>

    <!-- Mũi tên quay tốc độ cao -->
    <path d="M 285 85 A 95 95 0 0 1 310 140" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="310,148 304,136 316,138" fill="#ef4444"/>
    <text x="295" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">300 rpm</text>
  </g>

  <!-- Hộp tóm tắt quãng đường 1 giây -->
  <g transform="translate(210, 280)" filter="url(#shadow)">
    <rect x="-135" y="-14" width="270" height="28" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
      1s quay 5 vòng: S = 5 · 2π(40) = 400π cm
    </text>
  </g>

  <text x="210" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Bánh đà động cơ bán kính R = 40 cm quay 300 vòng/phút
  </text>
</svg>
