<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" style="max-width:100%;font-family:Arial,sans-serif;background:#fff;">
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Bài toán thực tế: Mạch điện song song và nối tiếp</text>
  <!-- Series circuit -->
  <text x="170" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#0054a6">Mắc nối tiếp: R_nt = R₁ + R₂ = 12 Ω</text>
  <line x1="20" y1="90" x2="80" y2="90" stroke="#333" stroke-width="2.5"/>
  <!-- R1 zigzag -->
  <polyline points="80,90 90,75 100,105 110,75 120,105 130,75 140,90" fill="none" stroke="#0054a6" stroke-width="2.5"/>
  <text x="110" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#0054a6">R₁</text>
  <line x1="140" y1="90" x2="190" y2="90" stroke="#333" stroke-width="2.5"/>
  <!-- R2 zigzag -->
  <polyline points="190,90 200,75 210,105 220,75 230,105 240,75 250,90" fill="none" stroke="#cc6600" stroke-width="2.5"/>
  <text x="220" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc6600">R₂</text>
  <line x1="250" y1="90" x2="320" y2="90" stroke="#333" stroke-width="2.5"/>
  <circle cx="20" cy="90" r="4" fill="#333"/><text x="8" y="88" font-size="11">A</text>
  <circle cx="320" cy="90" r="4" fill="#333"/><text x="322" y="88" font-size="11">B</text>
  <!-- Parallel circuit -->
  <text x="170" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#c00">Mắc song song: R_ss = R₁R₂/(R₁+R₂) = 2.75 Ω</text>
  <line x1="20" y1="210" x2="80" y2="210" stroke="#333" stroke-width="2.5"/>
  <line x1="80" y1="210" x2="80" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="210" x2="80" y2="235" stroke="#333" stroke-width="2"/>
  <!-- R1 upper -->
  <polyline points="80,185 90,170 100,200 110,170 120,200 130,170 140,185" fill="none" stroke="#0054a6" stroke-width="2.5"/>
  <text x="110" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#0054a6">R₁</text>
  <line x1="140" y1="185" x2="240" y2="185" stroke="#333" stroke-width="2"/>
  <!-- R2 lower -->
  <polyline points="80,235 90,220 100,250 110,220 120,250 130,220 140,235" fill="none" stroke="#cc6600" stroke-width="2.5"/>
  <text x="110" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc6600">R₂</text>
  <line x1="140" y1="235" x2="240" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="185" x2="240" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="235" x2="240" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="210" x2="320" y2="210" stroke="#333" stroke-width="2.5"/>
  <circle cx="20" cy="210" r="4" fill="#333"/><text x="8" y="208" font-size="11">A</text>
  <circle cx="320" cy="210" r="4" fill="#333"/><text x="322" y="208" font-size="11">B</text>
  <!-- Solution -->
  <rect x="360" y="55" width="295" height="230" rx="10" fill="#f0fff4" stroke="#009060" stroke-width="2"/>
  <text x="507" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#003300">Giải bằng Định lí Viète đảo</text>
  <line x1="370" y1="92" x2="645" y2="92" stroke="#ccc"/>
  <text x="507" y="114" text-anchor="middle" font-size="12" fill="#222">(1) R₁ + R₂ = 12</text>
  <text x="507" y="138" text-anchor="middle" font-size="12" fill="#222">(2) R₁R₂ = 12 × 2,75 = 33</text>
  <line x1="370" y1="152" x2="645" y2="152" stroke="#ddd"/>
  <text x="507" y="174" text-anchor="middle" font-size="12" fill="#222">Phương trình: X² − 12X + 33 = 0</text>
  <text x="507" y="198" text-anchor="middle" font-size="12" fill="#222">Δ′ = 36 − 33 = 3 → √Δ′ = √3</text>
  <line x1="370" y1="212" x2="645" y2="212" stroke="#ddd"/>
  <text x="507" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#003300">R₁ = 6 + √3 Ω</text>
  <text x="507" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#003300">R₂ = 6 − √3 Ω</text>
  <!-- Physical context note -->
  <rect x="30" y="300" width="600" height="64" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="330" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">🔋 Ứng dụng kỹ thuật điện tử:</text>
  <text x="330" y="342" text-anchor="middle" font-size="12" fill="#444">Kỹ sư dùng Định lí Viète đảo để tính ngược thông số linh kiện ẩn ("hộp đen")</text>
  <text x="330" y="360" text-anchor="middle" font-size="12" fill="#444">khi chỉ đo được điện trở tương đương ở ngoài mạch.</text>
</svg>
